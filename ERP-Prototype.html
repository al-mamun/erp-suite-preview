<script>
/* ═══════════════════════════════════════════════════════════════════════════
   P1 — ICONOGRAPHY CLEANUP
   Uses the existing ICONS registry only. No new library, no new sizes, no
   restyling. Three call sites change.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── P1-1a  Attention-row chevron ──────────────────────────────────────────
   dsAttn()'s trailing chevron means "go to this record" — a forward
   affordance, so its direction follows the reading direction and it must
   mirror in Arabic. It was emitting chevR without .ic-flip. The vertical
   state icon on the left (ai) is NOT touched: it depicts a thing, not a
   direction.                                                               */
function dsAttn(kind,icon,title,sub,value,go){
 return `<div class="ds-attn" ${go?`onclick="${go}"`:''}><div class="ai ${kind}">${ic(icon,'ic-14')}</div>
  <div style="min-width:0"><div class="at">${title}</div><div class="as">${sub}</div></div>
  <div class="av">${value||''}${go?ic('chevR','ic-14 ic-flip'):''}</div></div>`;}

/* ── P1-1b  Drill-through arrow ────────────────────────────────────────────
   drill() means "continue through to the detail" — also reading-direction
   dependent, also missing .ic-flip.                                        */
function drill(label,go){return `<span class="ds-drill" ${go?`onclick="${go}"`:''}>${label}${ic('arrowR','ic-14 ic-flip')}</span>`;}

/* ── P1-2  Trend indicators ────────────────────────────────────────────────
   The Sales Analysis rows carry their trend as a literal glyph inside the
   pill text — "↑ 12%" — and enhance() was additionally prepending a generic
   status dot, so each pill rendered an icon AND a glyph. Swap the glyph for
   the registry's trend icon and keep the percentage as text.
     ↑ → trendUp     ↓ → trendDown     → → arrowR (flat)
   Up and down are vertical: they carry no reading direction and are NOT
   mirrored. The flat arrow means "unchanged", a magnitude, not a direction
   of travel — it is deliberately left unmirrored too.                      */
function trendIcons(root){
 (root||document).querySelectorAll('.pill').forEach(p=>{
  if(p.dataset.trend) return;
  const m=/^([↑↓→])\s*(\S.*)$/.exec(p.textContent.trim());
  if(!m) return;
  p.dataset.trend='1'; p.dataset.en='1'; p.dataset.sd='trend';
  const icon = m[1]==='↑' ? 'trendUp' : m[1]==='↓' ? 'trendDown' : 'arrowR';
  const label = m[1]==='↑' ? 'Trend up' : m[1]==='↓' ? 'Trend down' : 'No change';
  p.innerHTML = ic(icon,'ic-14') + '<span>' + esc(m[2]) + '</span>';
  if(!p.getAttribute('title')) p.setAttribute('title', label);
 });
}
enhance=(orig=>function(root){ const r=orig(root); try{ trendIcons(root); }catch(e){} return r; })(enhance);
buildTree(); paint();
</script>
<script>
/* ── P1-1c  Flow connector ─────────────────────────────────────────────────
   .flow .ar carries three different characters and only one of them is an
   icon:  "→" is a connector meaning "leads to" — a directional UI element
   that must mirror in Arabic;  "·" is a separator and  "=" is mathematical
   notation, and both correctly stay as text. Only the arrow is replaced.  */
function flowArrows(root){
 (root||document).querySelectorAll('.flow .ar').forEach(a=>{
  if(a.dataset.fa) return;
  if(a.textContent.trim()!=='→') { a.dataset.fa='keep'; return; }
  a.dataset.fa='1';
  a.innerHTML=ic('arrowR','ic-14 ic-flip');
  a.setAttribute('aria-label','leads to');
 });
}

</script>

<style>
/* ═══════════════════════════════════════════════════════════════════════════

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   SHARED DATATABLE ENGINE
   Extends the existing tbl() / renderList() rather than replacing them.
   State lives per table, keyed by screen + column signature, so one screen's
   search can never touch another's.
   ═══════════════════════════════════════════════════════════════════════ */
const TSTATE = {};
let _tkSeq = {};

function tkey(cols){
 const sig = active + '|' + cols.map(c => (c && c.h) || '').join('');
 _tkSeq[sig] = (_tkSeq[sig] || 0) + 1;
 return sig + '|' + _tkSeq[sig];
}
function tstate(k){
 if(!TSTATE[k]) TSTATE[k] = { q:'', f:{}, sort:null, sel:new Set(), page:1, ps:25 };
 return TSTATE[k];
}
const _tmpDiv = document.createElement('div');
function cellText(v){
 if(v === undefined || v === null) return '';
 const s = String(v);
 /* a cell is HTML: a plain cell is still escaped text, so entities in it must
    decode the same way they do inside markup. No shipped cell carries one;
    an edited value can. */
 if(s.indexOf('<') < 0 && !/&(#\d+|#x[0-9a-f]+|[a-z]+);/i.test(s)) return s.trim();
 _tmpDiv.innerHTML = s;
 return (_tmpDiv.textContent || '').trim();
}
/* type-aware comparison (Part 6) */
const _numOf = t => {
 const s = t.replace(/[\s,]/g,'').replace(/[%]/g,'').replace(/^[^\d.+\-−]*/,'');
 if(!/^[+\-−]?\d/.test(s)) return null;
 const v = parseFloat(s.replace('−','-'));
 return isNaN(v) ? null : v;
};
const _dateOf = t => {
 let m = /^(\d{2})\/(\d{2})\/(\d{4})/.exec(t);  if(m) return +new Date(+m[3],+m[2]-1,+m[1]);
 m = /^(\d{2})\/(\d{2})\/(\d{2})$/.exec(t);     if(m) return +new Date(2000 + +m[3],+m[2]-1,+m[1]);
 m = /^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/.exec(t);
 if(m){ const mo = 'janfebmaraprmayjunjulaugsepoctnovdec'.indexOf(m[2].toLowerCase())/3;
        if(mo >= 0 && mo === Math.floor(mo)) return +new Date(+m[3],mo,+m[1]); }
 m = /^(\d{2})\/(\d{2})$/.exec(t);              if(m) return +new Date(2026,+m[2]-1,+m[1]);
 return null;
};
function cmpCells(a,b){
 if(a === b) return 0;
 if(a === '' || a === '—') return 1;
 if(b === '' || b === '—') return -1;
 const da = _dateOf(a), db = _dateOf(b);
 if(da !== null && db !== null) return da - db;
 const na = _numOf(a), nb = _numOf(b);
 if(na !== null && nb !== null) return na - nb;
 return a.localeCompare(b, lang === 'ar' ? 'ar' : 'en', { numeric:true, sensitivity:'base' });
}
function sortableCol(c, idx, rows){
 const h = ((c && c.h) || '').trim();
 if(!h) return false;
 if(/^select$/i.test(h)) return false;
 const sample = rows.slice(0,4).map(r => String(r[idx] === undefined ? '' : r[idx]));
 if(sample.some(s => /class="rowact"|type="checkbox"|<button/.test(s))) return false;
 return true;
}

const _tblBase = tbl;
function tbl(cols, rows, opt){
 opt = opt || {};
 rows = rows || [];
 if(opt.raw || !cols || !cols.length) return _tblBase(cols, rows, opt);

 const k = tkey(cols), st = tstate(k);
 const total = rows.length;
 const idx = rows.map((r,i) => ({ r:r, i:i, t:cols.map((c,ci) => cellText(r[ci])) }));

 let view = idx;
 const fkeys = Object.keys(st.f);
 if(fkeys.length) view = view.filter(o => fkeys.every(ci => o.t[ci] === st.f[ci]));
 const q = st.q.trim().toLowerCase();
 if(q) view = view.filter(o => o.t.some(t => t.toLowerCase().indexOf(q) >= 0));
 const matched = view.length;

 if(st.sort){
  const c = st.sort.c, dir = st.sort.dir;
  view = view.slice().sort((x,y) => { const r = cmpCells(x.t[c], y.t[c]); return dir === 'desc' ? -r : r; });
 }

 let pageRows = view, pages = 1, from = 0;
 if(opt.paged){
  pages = Math.max(1, Math.ceil(matched / st.ps));
  if(st.page > pages) st.page = pages;
  from = (st.page - 1) * st.ps;
  pageRows = view.slice(from, from + st.ps);
 }

 const th = cols.map((c,i) => {
  const sortable = sortableCol(c,i,rows);
  const on = st.sort && st.sort.c === i;
  const icon = on ? (st.sort.dir === 'asc' ? 'trendUp' : 'trendDown') : 'sort';
  const attrs = sortable
    ? ' data-c="' + i + '" data-tk="' + esc(k) + '" tabindex="0" role="button" aria-sort="' +
      (on ? (st.sort.dir === 'asc' ? 'ascending' : 'descending') : 'none') + '"'
    : '';
  return '<th class="' + (c.a||'') + (on ? ' sorted' : '') + '" scope="col"' + attrs + '>' +
    esc(tx(c.h)) + (sortable ? '<span class="si">' + ic(icon,'ic-14') + '</span>' : '') + '</th>';
 }).join('');

 const body = pageRows.length
  ? '<tbody>' + pageRows.map(o => '<tr data-ri="' + o.i + '"' + (st.sel.has(o.i) ? ' class="selrow"' : '') + '>' +
      cols.map((c,i) => '<td class="' + (c.a||'') + '">' + (o.r[i] === undefined ? '' : o.r[i]) + '</td>').join('') +
      '</tr>').join('') + '</tbody>'
  : '<tbody><tr><td colspan="' + cols.length + '">' + emptyFor(k, total, q, fkeys.length, opt) + '</td></tr></tbody>';

 return '<div class="tw" data-scroll data-tk="' + esc(k) + '" data-total="' + total + '" data-shown="' + matched +
   '" data-pages="' + pages + '" data-page="' + st.page + '" data-from="' + (from+1) + '" data-to="' + (from + pageRows.length) +
   '"><table' + (opt.min ? ' style="min-width:' + opt.min + 'px"' : '') + '><thead><tr>' + th + '</tr></thead>' + body + '</table></div>';
}
window.tbl = tbl;

function emptyFor(k, total, q, nFilters, opt){
 const noun = (opt && opt.noun) || 'rows';
 const kq = k.replace(/'/g, "\\'");
 if(total === 0)
  return dsState('empty', { title:(opt && opt.emptyTitle) || 'Nothing here yet',
    text:(opt && opt.emptyText) || 'When the first record is created it will appear in this list.' });
 if(q)
  return dsState('noresults', { title:'No ' + noun + ' match “' + q + '”',
    text:'Nothing in this list contains that text. Clear the search to see all ' + total + '.',
    actions:[['Clear the search', "tClearQuery('" + kq + "')", 'p']] });
 if(nFilters)
  return dsState('noresults', { title:'No ' + noun + ' match the selected filters',
    text:'All ' + total + ' ' + noun + ' are hidden by the filters above.',
    actions:[['Clear all filters', "tClearAll('" + kq + "')", 'p']] });

}

function tRepaint(){ paint(); }
function tSetQuery(k,v){ const s = tstate(k); s.q = v; s.page = 1; tRepaint(); }
function tClearQuery(k){ tSetQuery(k,''); }
function tSetFilter(k,col,val){ const s = tstate(k); if(val === null) delete s.f[col]; else s.f[col] = val; s.page = 1; tRepaint(); }
function tClearAll(k){ const s = tstate(k); s.f = {}; s.q = ''; s.page = 1; tRepaint(); }
function tSort(k,c){
 const s = tstate(k);
 if(!s.sort || s.sort.c !== c) s.sort = { c:c, dir:'asc' };
 else if(s.sort.dir === 'asc') s.sort = { c:c, dir:'desc' };
 else s.sort = null;
 tRepaint();
}
function tPage(k,p){ const s = tstate(k); s.page = Math.max(1,p); tRepaint(); }
function tPageSize(k,n){ const s = tstate(k); s.ps = n; s.page = 1; tRepaint(); }
function tToggleRow(k,i){ const s = tstate(k); if(s.sel.has(i)) s.sel.delete(i); else s.sel.add(i); tRepaint(); }
function tSelectAll(k,on){
 const s = tstate(k);
 const tw = document.querySelector('.tw[data-tk="' + CSS.escape(k) + '"]');
 if(!on) s.sel.clear();
 else if(tw) tw.querySelectorAll('tbody tr[data-ri]').forEach(tr => s.sel.add(+tr.dataset.ri));
 tRepaint();
}
paint();
</script>
<script>
/* the per-paint occurrence counter has to be cleared at the start of each
   render, otherwise every repaint mints a new key and the table's state is
   discarded the moment it changes. */
paint = (orig => function(){ _tkSeq = {}; return orig(); })(paint);
paint();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   WIRING LAYER — connects the toolbars, chips, pagers, checkboxes and headers
   that already exist on screens to the DataTable state. One delegated
   listener on #view; nothing global, nothing per-screen.
   ═══════════════════════════════════════════════════════════════════════ */

/* find the table a control belongs to: nearest .tw[data-tk] in the same pane */
function tkOf(el){
 const pane = el.closest('.pane') || el.closest('#view');
 if(!pane) return null;
 const tw = pane.querySelector('.tw[data-tk]');
 return tw ? tw.dataset.tk : null;
}
/* which column does a filter <select> address? the one whose values match */
function colForOption(k, text){
 const tw = document.querySelector('.tw[data-tk="' + CSS.escape(k) + '"]');
 if(!tw) return -1;
 const heads = [...tw.querySelectorAll('thead th')];
 const rows = [...tw.querySelectorAll('tbody tr[data-ri]')];
 for(let c = 0; c < heads.length; c++){
  if(rows.some(r => (r.children[c] ? r.children[c].textContent.trim() : '') === text)) return c;
 }
 return -1;
}

/* ── stamp controls so they can be found again after a repaint ── */
function wireTables(root){
 (root || document).querySelectorAll('.tw[data-tk]').forEach(tw => {
  const k = tw.dataset.tk, st = tstate(k);
  const pane = tw.closest('.pane') || tw.parentElement;
  if(!pane) return;

  /* the search box that sits above this table */
  pane.querySelectorAll('input.in[placeholder]').forEach(inp => {
   if(inp.closest('#mBody') || inp.dataset.sf) return;
   inp.dataset.sf = k;
   inp.value = st.q;
   inp.setAttribute('autocomplete','off');
  });

  /* live row count */
  pane.querySelectorAll('.rc').forEach(rc => {
   const shown = +tw.dataset.shown, total = +tw.dataset.total;
   rc.textContent = shown === total
     ? total + ' ' + (total === 1 ? tr('row') : tr('rows'))
     : shown + ' ' + tr('of') + ' ' + total;
  });

  /* pager */
  const pg = pane.querySelector('.pgbar');
  if(pg){
   const shown = +tw.dataset.shown, page = +tw.dataset.page, pages = +tw.dataset.pages;
   const lab = pg.querySelector('span');
   if(lab) lab.innerHTML = tr('Showing') + ' <b>' + tw.dataset.from + '–' + tw.dataset.to + '</b> ' + tr('of') + ' <b>' + shown + '</b>';
   const btns = pg.querySelectorAll('.pg button');
   if(btns.length >= 3){
    btns[0].dataset.pgk = k; btns[0].dataset.pg = 'prev'; btns[0].disabled = page <= 1;
    btns[1].dataset.pgk = k; btns[1].dataset.pg = 'cur';  btns[1].textContent = page + ' / ' + pages;
    btns[2].dataset.pgk = k; btns[2].dataset.pg = 'next'; btns[2].disabled = page >= pages;
   }
   const ps = pg.querySelector('select');
   if(ps){ ps.dataset.psk = k; ps.value = st.ps + ' / page'; }
  }

  /* active-filter chips reflect real filter state */
  const bar = pane.querySelector('.ds-toolbar');
  if(bar && !bar.dataset.fk){
   bar.dataset.fk = k;
   const chips = [...bar.querySelectorAll('.ds-fchip')];
   const active = Object.keys(st.f);
   chips.forEach(ch => { const x = ch.querySelector('button'); if(x){ x.dataset.rmk = k; } });
   if(active.length){
    const heads = [...tw.querySelectorAll('thead th')];
    const extra = active.map(c =>
      '<span class="ds-fchip"><b>' + esc(heads[c] ? heads[c].textContent.replace(/\s+/g,' ').trim() : 'Filter') + '</b> ' +
      esc(st.f[c]) + '<button aria-label="Remove filter" data-rmk="' + esc(k) + '" data-rmc="' + c + '">' + ic('x','ic-14') + '</button></span>').join('');
    const clear = bar.querySelector('.b.g');
    if(clear) clear.insertAdjacentHTML('beforebegin', extra); else bar.insertAdjacentHTML('beforeend', extra);
   }
   const clear = bar.querySelector('.b.g');
   if(clear) clear.dataset.clrk = k;
  }

  /* selection bar — only where bulk buttons already exist on the screen */
  if(st.sel.size && !pane.querySelector('.selbar')){
   const bulk = [...pane.querySelectorAll('button')].filter(x => /selected/i.test(x.textContent));
   bulk.forEach(x => { x.dataset.bulkk = k; });
   const names = bulk.map(x => '<button class="b" data-bulkk="' + esc(k) + '">' + esc(x.textContent.trim()) + '</button>').join('');
   tw.insertAdjacentHTML('beforebegin',
     '<div class="selbar">' + ic('checkCircle','ic-14') + '<b>' + st.sel.size + '</b> ' +
     tr('selected') + '<div class="sa">' + names +
     '<button class="b" onclick="tSelectAll(\'' + k.replace(/'/g,"\\'") + '\',false)">' + tr('Clear selection') + '</button></div></div>');
  }
 });
}
enhance = (orig => function(root){ const r = orig(root); try{ wireTables(root); }catch(e){} return r; })(enhance);

/* ── one delegated listener set on #view ── */
(function(){
 const view = document.querySelector('#view');

 view.addEventListener('input', e => {
  const inp = e.target;
  if(!inp.dataset || !inp.dataset.sf) return;
  const k = inp.dataset.sf, pos = inp.selectionStart;
  tSetQuery(k, inp.value);
  const again = document.querySelector('input[data-sf="' + CSS.escape(k) + '"]');
  if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(x){} }
 });

 view.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset && el.dataset.psk){                       /* page size */
   tPageSize(el.dataset.psk, parseInt(el.value,10) || 25); return; }
  if(el.tagName === 'SELECT' && !el.closest('#mBody')){    /* filter select */
   const k = tkOf(el); if(!k) return;
   const text = el.options[el.selectedIndex] ? el.options[el.selectedIndex].text.trim() : '';
   if(/^all\b|^كل\b/i.test(text)){ tClearAll(k); return; }
   const c = colForOption(k, text);
   if(c >= 0) tSetFilter(k, c, text);
   return; }
  if(el.type === 'checkbox' && el.closest('.tw')){         /* row / select-all */
   const tw = el.closest('.tw'), k = tw.dataset.tk;
   const tr2 = el.closest('tr[data-ri]');
   if(tr2) tToggleRow(k, +tr2.dataset.ri); else tSelectAll(k, el.checked);
  }
 });

 view.addEventListener('click', e => {
  const th = e.target.closest('th[data-c]');
  if(th){ tSort(th.dataset.tk, +th.dataset.c); return; }
  const rm = e.target.closest('button[data-rmk]');
  if(rm){ if(rm.dataset.rmc !== undefined) tSetFilter(rm.dataset.rmk, +rm.dataset.rmc, null);
          else tClearAll(rm.dataset.rmk); return; }
  const clr = e.target.closest('[data-clrk]');
  if(clr){ tClearAll(clr.dataset.clrk); return; }
  const pgb = e.target.closest('button[data-pg]');

/* colIdx: header text -> column index on an existing list */

 const e = ENT[type]; if(!e) return null;

 const a = name.toLowerCase();
 return d.rows.filter(r => {
  const bv = cellText(r[ci]).toLowerCase();
  if(bv === a) return true;
  if(a.length >= 6 && bv.indexOf(a) === 0) return true;
  if(bv.length >= 6 && a.indexOf(bv) === 0) return true;

 actions.push('<button class="b d" onclick="askDelete(\'' + e.list + '\',' + rec.i + ',\'' +
   esc(name).replace(/'/g,"\\'") + '\')">' + tr('Delete') + '</button>');

 /* related records — real rows only, each with its own empty state */
 let related = '';
 (e.rel || []).forEach(r => {
  const rows = recRelated(r, name);
  if(rows === null) return;
  const rlabel = tr(r.label);
  related += pane(rlabel, rows.length

 });
 /* documents: show the party's other documents as the relationship back */
 if(e.party){

  const sib = pv ? (L[e.list].rows || []).filter(r2 => cellText(r2[colIdx(e.list, e.party.col)]) === pv && r2 !== row) : [];
  if(sib.length) related += pane(tr('Other') + ' ' + e.kind.toLowerCase() + 's ' + tr('for') + ' ' + pv,
    tbl(d.cols, sib, { min:Math.max(680,(d.cols.length||6)*108) }));
 }

 /* activity — only the audit rows that actually mention this record */

   r.some(cell => cellText(cell).indexOf(name) >= 0 || (code && cellText(cell).indexOf(code) >= 0)));

render = (orig => function(id, en, ar){

wireTables = (orig => function(root){

  const t0 = colIdx(tw.dataset.src, e.title), i0 = colIdx(tw.dataset.src, e.id);

 'Class':'التصنيف', 'Level':'المستوى', 'Posting behaviour':'سلوك الترحيل', 'Balance':'الرصيد',

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   P3.1 — ACCEPTANCE FIXES
   1  Edit populates from the record and writes back to the same L row
   2  Post changes real prototype state, or says honestly that it cannot
   3  Relationship resolution by priority, never by guess
   Nothing here replaces ENT, recordScreen(), the navigation, the DataTable,
   the Owner Console or the licence architecture. It corrects them in place.
   ═══════════════════════════════════════════════════════════════════════ */

/* ─────────────────────────────────────────────────────────────────────────
   FIX 2a — registry correction.
   Five document entities declared badge:'Status'. Those datasets carry the
   column 'State'. colIdx therefore returned -1 and the badge was blank, so
   the posting gate could never evaluate. The column name is corrected to the
   one the dataset actually has; no dataset is changed.
   ───────────────────────────────────────────────────────────────────────── */
(function(){
 Object.keys(ENT).forEach(t => {
  const e = ENT[t], d = L[e.list];
  if(!d || !d.cols) return;
  if(colIdx(e.list, e.badge) >= 0) return;                 /* already correct */
  const c = d.cols.find(c2 => c2 && /^(state|status)$/i.test(c2.h || ''));
  if(c) e.badge = c.h; else delete e.badge;                /* rcpts has neither */
 });
})();

/* ─────────────────────────────────────────────────────────────────────────
   FIX 1 — EDIT AN EXISTING RECORD
   One mechanism, openEditRecord(type, id), for every registered type.
   The form definition still comes from F[ENT[type].form]; only the values
   are overlaid onto it. No form definition is duplicated and no second row
   store exists — the write goes back into the same L[list].rows[i].
   ───────────────────────────────────────────────────────────────────────── */

/* explicit aliases, only where a form label and a column header name the same
   thing in the same format. Anything not listed and not an exact match is
   treated as unmapped and is never written. */
const FIELDALIAS = {
 cust:  { 'account in the chart':'Account' },
 supp:  { 'default currency':'Currency', 'account in the chart':'Account' },
 items: { 'cost price':'Cost', 'minimum quantity':'Minimum' },
 emp:   { 'full name':'Name', 'contract type':'Contract' }
};
const nlab = s => String(s || '').replace(/\*/g,'').replace(/\s+/g,' ').trim().toLowerCase();

/* a cell may be plain text or a status pill. Anything else (a row action, a
   link, nested markup) is left alone rather than risk corrupting it. */
function cellShape(cell){
 const s = String(cell === undefined || cell === null ? '' : cell);
 if(s.indexOf('<') < 0) return { kind:'text', text:cellText(s) };
 const m = /^<span class="pill ([^"]*)">([^<]*)<\/span>$/.exec(s.trim());
 if(m) return { kind:'pill', tone:m[1], text:m[2] };
 return { kind:'other', text:cellText(s) };
}
function cellWrite(cell, value){
 const sh = cellShape(cell);
 if(sh.kind === 'text') return esc(value);
 if(sh.kind === 'pill') return '<span class="pill ' + sh.tone + '">' + esc(value) + '</span>';
 return cell;                                              /* never rewritten */
}

/* which form field addresses which column, for this entity */
function editMap(type){
 const e = ENT[type], d = L[e.list];
 const alias = FIELDALIAS[type] || {};
 const byHeader = {};
 d.cols.forEach((c,i) => { if(c && c.h) byHeader[nlab(c.h)] = i; });
 return function(label){
  const n = nlab(label);
  let i = byHeader[n];
  if(i === undefined && alias[n]) i = byHeader[nlab(alias[n])];
  if(i === undefined) return -1;
  return cellShape(d.rows[0] ? d.rows[0][i] : '').kind === 'other' ? -1 : i;
 };
}

let EDITING = null;      /* {type, list, ri, id, name} — cleared when the modal closes */

function openEditRecord(type, id){
 const e = ENT[type]; if(!e || !e.form || !F[e.form]) return;
 const rec = recFind(type, id);
 if(!rec){ toast('in', tr('Record not found'), id + ' is no longer in the list.'); return; }
 EDITING = { type:type, list:e.list, ri:rec.i, id:id, fwCols:[], stamped:false,
   name: cellText(rec.row[colIdx(e.list, e.title)]) || id };
 openM('__editrec');
 stampEditFields();
}
/* the only place a field is bound to a column. If the counts ever disagree the
   binding is refused outright rather than guessed — a wrong binding would
   write a value into the wrong column. */
function stampEditFields(){
 if(!EDITING) return;
 const fws = [...document.querySelectorAll('#mBody .fw')];
 if(fws.length !== EDITING.fwCols.length){ EDITING.stamped = false; return; }
 fws.forEach((fw, n) => { fw.dataset.ci = EDITING.fwCols[n]; });
 EDITING.stamped = true;
}
window.openEditRecord = openEditRecord;

/* the edit form: F[ENT[type].form] with the record's own values overlaid */
Object.defineProperty(F, '__editrec', { configurable:true, get(){
 if(!EDITING) return F.generic;
 const e = ENT[EDITING.type], base = F[e.form];
 const row = L[EDITING.list].rows[EDITING.ri] || [];
 const find = editMap(EDITING.type);
 let mapped = 0, unmapped = 0;

 /* Field identity is the column index, recorded here in render order and
    stamped onto the controls after the modal is built. The rendered <label>
    is translated, so it can never be the identity — matching on it saved
    nothing in Arabic. fld() emits .fw for every field except note, summary
    and chk, so those three are the ones left out of this list. */
 const fwCols = [];
 const sections = (base.s || []).map(sec => ({
  h: sec.h, c: sec.c,
  f: (sec.f || []).map(f => {
   if(f.t === 'note' || f.t === 'summary') return f;
   const i = find(f.l);
   if(f.t !== 'chk') fwCols.push(i);
   if(i < 0){
    unmapped++;
    /* not addressable on this dataset: shown, disabled, and it changes nothing.
       It is never populated with the new-record default, which would be
       invented data for a record that has no such field. */
    return Object.assign({}, f, { v:'', o:f.o, dis:1, req:0,
      hint: tr('This field is not part of the stored record — editing it here would change nothing, so it is disabled.') });
   }
   mapped++;
   const val = cellShape(row[i]).text;
   if(f.t === 'sel'){
    const opts = (f.o || []).slice();
    if(val && opts.indexOf(val) < 0) opts.unshift(val);    /* show what is stored */
    else if(val) { opts.splice(opts.indexOf(val), 1); opts.unshift(val); }
    return Object.assign({}, f, { o:opts });
   }
   return Object.assign({}, f, { v:val });
  })
 }));

 EDITING.fwCols = fwCols;
 return {
  t: tr('Edit') + ' ' + EDITING.name,
  btns: [tr('Cancel'), tr('Save changes')],
  ok: 'saveRecordEdit()',
  s: [{ h: tr('You are editing an existing record'), c:1, f:[

function saveRecordEdit(){
 if(!EDITING) { closeM(); return; }

 if(!ed.stamped){
  closeM(); EDITING = null;
  toast('in', tr('Nothing changed'),
    'The form fields could not be matched to the record’s columns, so nothing was written. This is deliberate — a guess here would put a value in the wrong column.');
  return;
 }
 const changed = [];
 document.querySelectorAll('#mBody .fw').forEach(fw => {
  const ctl = fw.querySelector('.in');
  if(!ctl || ctl.disabled || ctl.readOnly) return;         /* unmapped fields cannot write */
  const i = fw.dataset.ci === undefined ? -1 : +fw.dataset.ci;
  if(i < 0) return;
  const now = cellShape(row[i]).text;
  const next = (ctl.value || '').trim();
  if(next === now) return;
  if(next === ''){ return; }                               /* never blank a stored value */
  row[i] = cellWrite(row[i], next);
  changed.push((d.cols[i] || {}).h || String(i));
 });

 /* the tab label and the tab id follow the identifier, which may itself have
    been edited — reopen on the new id so the record stays continuous */
 const newId = cellText(row[colIdx(ed.list, e.id)]);
 const newName = cellText(row[colIdx(ed.list, e.title)]) || newId;
 closeM(); EDITING = null;

 if(!changed.length){
  toast('in', tr('Nothing changed'), 'No field was given a different value, so the record was left exactly as it was.');
  return;
 }
 if(newId !== ed.id){
  const t = TABS.find(x => x.id === 'rec:' + ed.type + ':' + ed.id);
  if(t){ t.id = 'rec:' + ed.type + ':' + newId; t.en = newName; t.ar = newName;
         if(active === 'rec:' + ed.type + ':' + ed.id) active = t.id; }
 } else {
  const t = TABS.find(x => x.id === 'rec:' + ed.type + ':' + ed.id);
  if(t){ t.en = newName; t.ar = newName; }
 }
 buildTree(); paint();
 toast('ok', tr('Record updated'),
   changed.length + ' field' + (changed.length > 1 ? 's' : '') + ' changed on ' + newName +
   ' — this is real prototype state, so the list and the detail both show it. Nothing was sent anywhere and a reload restores the original data.');
}

/* ─────────────────────────────────────────────────────────────────────────
   FIX 2b — POST CHANGES REAL PROTOTYPE STATE
   The document's own state column is set to Posted in L. No ledger, no
   journal entry, no balance is touched — the prototype has no mechanism for

   ───────────────────────────────────────────────────────────────────────── */
const POSTABLE_FROM = /^draft$/i;      /* the only pre-posting state in this data */

function postState(type, id){
 const e = ENT[type]; if(!e || !e.doc || !e.badge) return null;
 const rec = recFind(type, id); if(!rec) return null;
 const bi = colIdx(e.list, e.badge); if(bi < 0) return null;

 return { e:e, rec:rec, bi:bi, cur:cur, postable: POSTABLE_FROM.test(cur) };
}
function postRecord(type, id){
 const st = postState(type, id);
 if(!st || !st.postable){
  toast('in', tr('Nothing to post'), 'This document is not in a draft state, so there is nothing to post.');
  return;
 }
 st.rec.row[st.bi] = cellWrite(st.rec.row[st.bi], 'Posted');
 paint();

   ' — the document state changed locally to Posted. This is prototype state and does not create a real ledger transaction.');
}

/* the confirmation the record page raises, filled from the real row */
function askPostRecord(type, id){

 if(!st || !st.postable){ postRecord(type, id); return; }
 POSTQ = { doc: st.e.kind, num:id, kind: st.e.kind.toLowerCase(),
           run: () => postRecord(type, id), local:1 };

}

/* doPost(): run the action, and let the action speak for itself when it is a
   real local state change. The generic toast is only for the screens that
   still have no document row behind them. */
doPost = function(){
 const d = POSTQ; closeM(); POSTQ = null;
 if(d && d.run){ try{ d.run(); }catch(err){} }
 if(d && d.local) return;                                  /* postRecord already reported */
 if(d && d.run) return;                                    /* the screen's own handler reported */

};

/* Screen-level Post buttons keep the P2 capture interceptor. Those with no
   handler of their own now fall through to doPost()'s honest "not connected"

/* ─────────────────────────────────────────────────────────────────────────
   FIX 3 — RELATIONSHIP RESOLUTION BY PRIORITY
     1  identifier      the via column holds this record's own code
     2  explicit field  rel.on names the parent column to join on
     3  exact value     normalised equality on the join value
     4  demo fallback   whole-token prefix, and only when it resolves to a
                        single distinct value. Anything ambiguous resolves to
                        nothing and says so.
   ───────────────────────────────────────────────────────────────────────── */
const rnorm = s => String(s === undefined || s === null ? '' : cellText(s))
  .replace(/\s+/g,' ').trim().toLowerCase();

function recRelated(rel, name, rec){
 const d = L[rel.list]; if(!d || !d.rows) return null;
 const ci = colIdx(rel.list, rel.via); if(ci < 0) return null;
 const vals = d.rows.map(r => rnorm(r[ci]));

 /* 1 — identifier */
 if(rec && rec.e){
  const code = rnorm(rec.row[colIdx(rec.e.list, rec.e.id)]);
  if(code){
   const hit = d.rows.filter((r,i) => vals[i] === code);
   if(hit.length) return { rows:hit, mode:'id' };
  }
 }
 /* 2 — explicit mapped field on the parent */
 if(rel.on && rec && rec.e){
  const oi = colIdx(rec.e.list, rel.on);
  if(oi >= 0){
   const key = rnorm(rec.row[oi]);
   if(key){
    const hit = d.rows.filter((r,i) => vals[i] === key);
    return { rows:hit, mode:'mapped' };
   }
  }
 }
 /* 3 — exact normalised value */
 const a = rnorm(name);
 if(!a) return { rows:[], mode:'none' };
 const exact = d.rows.filter((r,i) => vals[i] === a);
 if(exact.length) return { rows:exact, mode:'exact' };

 /* 4 — conservative fallback. One string must be a whole-token prefix of the
        other, and every candidate must name the SAME value. Two different
        values means the relationship is ambiguous, and an ambiguous
        relationship is not a relationship. */
 const tokenPrefix = (short, long) =>
   short.length >= 6 && long.indexOf(short) === 0 && (long.length === short.length || long[short.length] === ' ');
 const cand = [];
 d.rows.forEach((r,i) => {
  const b = vals[i]; if(!b) return;
  if(tokenPrefix(a, b) || tokenPrefix(b, a)) cand.push(i);
 });
 if(!cand.length) return { rows:[], mode:'none' };
 const distinct = [...new Set(cand.map(i => vals[i]))];
 /* report the value as the data writes it, not as the comparison normalised it */
 const asWritten = v => cellText(d.rows[cand.find(i => vals[i] === v)][ci]);
 if(distinct.length > 1)
  return { rows:[], mode:'ambiguous', candidates: distinct.map(asWritten) };
 return { rows: cand.map(i => d.rows[i]), mode:'fallback', on: asWritten(distinct[0]) };
}

/* ─────────────────────────────────────────────────────────────────────────

   ───────────────────────────────────────────────────────────────────────── */
recordScreen = (function(){

  const facts = d.cols.map((c,i) => {

    if(h === e.title || h === e.id) return null;

  }).filter(Boolean);

  const factGrid = '<div class="recfacts">' + facts.map(f =>
    '<div><div class="fl">' + esc(tx(f.l)) + '</div><div class="fv' + (f.v ? '' : ' mu') + '">' +
    (f.v !== null ? f.v : tr('Not available')) + '</div></div>').join('') + '</div>';

  const q = s => String(s).replace(/'/g,"\\'");
  const actions = [];

   actions.push('<button class="b p" onclick="openEditRecord(\'' + q(type) + '\',\'' + q(id) + '\')">' + tr('Edit') + '</button>');
  if(e.party){
   const pv = cellText(row[colIdx(e.list, e.party.col)]);
   if(pv) actions.push('<button class="b" onclick="openRecord(\'' + e.party.type + '\',\'' +
     q(partyIdFor(e.party.type, pv)) + '\')">' + esc(colLabel(e.list, e.party.col)) + ': ' + esc(pv) + '</button>');
  }
  actions.push('<button class="b" onclick="recPrint(\'' + esc(e.kind) + '\',\'' + q(esc(code || name)) + '\')">' + tr('Print') + '</button>');
  /* Post appears only where the document's own stored state is Draft */
  if(e.doc && POSTABLE_FROM.test(badgeText))
   actions.push('<button class="b post" data-posted="1" onclick="askPostRecord(\'' + q(type) + '\',\'' + q(id) + '\')">' + tr('Post') + '</button>');
  actions.push('<button class="b d" onclick="askDelete(\'' + e.list + '\',' + rec.i + ',\'' + q(esc(name)) + '\')">' + tr('Delete') + '</button>');

  let related = '';
  (e.rel || []).forEach(r => {
   const res = recRelated(r, name, rec);
   if(res === null) return;
   const rlabel = tr(r.label);
   let body, right = '';
   if(res.mode === 'ambiguous'){
    body = dsState('notconf', {
      title: tr('Relationship could not be resolved uniquely'),
      text: tr('More than one value in this list could refer to this record, and the prototype data carries no identifier to settle it. Nothing is shown rather than an arbitrary choice.'),
      detail: res.candidates.slice(0,4).map(c => [tr('Possible match'), c]) });
   } else if(res.rows.length){
    body = tbl(L[r.list].cols, res.rows,
      { min: Math.max(680, (L[r.list].cols.length || 6) * 108), noun: rlabel.toLowerCase() });
    right = pill('mu', res.rows.length + '');
    if(res.mode === 'fallback')
     body = '<div class="relnote">' + ic('alertT','ic-14') + '<span>' +
       esc(tr('Joined on the name')) + ' “' + esc(res.on) + '” — ' +
       esc(tr('this list names the record slightly differently and carries no identifier. It is the only value that could match.')) +
       '</span></div>' + body;
   } else {
    body = dsState('empty', { title: tr('No') + ' ' + rlabel.toLowerCase() + ' ' + tr('for this record yet'),
      text: tr('When one is created it appears here.') });
   }
   related += pane(rlabel, body, right);
  });

  if(e.party){
   const pv = cellText(row[colIdx(e.list, e.party.col)]);
   const sib = pv ? (L[e.list].rows || []).filter(r2 => cellText(r2[colIdx(e.list, e.party.col)]) === pv && r2 !== row) : [];
   if(sib.length) related += pane(tr('Other') + ' ' + e.kind.toLowerCase() + 's ' + tr('for') + ' ' + pv,
     tbl(d.cols, sib, { min:Math.max(680,(d.cols.length||6)*108) }));
  }

  const aud = (L.audit && L.audit.rows || []).filter(r =>
    r.some(cell => cellText(cell).indexOf(name) >= 0 || (code && cellText(cell).indexOf(code) >= 0)));
  const activity = pane(tr('Activity'), aud.length
    ? tbl(L.audit.cols, aud, { min:820 })
    : dsState('empty', { title: tr('No recorded activity for this record'),
        text: tr('The prototype audit log carries only a few sample events. Nothing here has been invented to fill the section.') }));

  const subs = [ e.kind ];
  if(code && code !== name) subs.push('<span class="ds-code">' + esc(code) + '</span>');
  if(e.party){ const pv = cellText(row[colIdx(e.list, e.party.col)]); if(pv) subs.push(esc(pv)); }

  return dsEntity(e.icon, name, badge ? ' ' + badge : '', subs, [], actions) +
    pane(tr('Details'), factGrid) + related + activity;
 };
})();

function tbAggregate(level){
 if(level === 'all') return TBROWS.map(r => ({ c:r.c, n:r.n, o:r.o, k:r.k }));

 TBROWS.forEach(r => {

/* ── the balance sheet reads the same rows, so the two can never disagree ── */
S.bs = function(){
 const bsRows = TBROWS.filter(r => !/^[67]/.test(r.c));      /* profit & loss closes to the result */
 const pl = TBROWS.filter(r => /^[67]/.test(r.c)).reduce((a,r) => a + r.k, 0);
 const f2 = v => v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
 const pick = (codes) => bsRows.filter(r => codes.some(c => String(r.c).indexOf(c) === 0));
 const sum = (rows, key) => rows.reduce((a,r) => a + r[key], 0);

 const assetGroups = [
  ['Fixed assets — cost', ['21','213','215','218']], ['Accumulated depreciation', ['28']],
  ['Stock', ['30']], ['Customers', ['411']], ['Notes receivable', ['413']],

 ];
 const liabGroups = [

 ];
 const build = (groups, sign) => {

 };
 const A = build(assetGroups, 1);

 A.out.push(['<b>' + tr('Total assets') + '</b>', '<b>' + f2(A.tot) + '</b>']);

};

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   CR-005 — COMMISSION BY CATEGORY AND SUB CATEGORY
   CR-004 is not built here; the manager level is still a separate decision.

   The client: "we have sales manager in some companies and commisions by
   category or subcategory".

   Until now a salesman had ONE rate applied to a whole invoice. Two things
   were missing: somewhere to say the rate differs by what was sold, and a
   calculation that reads the lines rather than the document total. Both are
   built here, and the report computes — no commission figure is typed in.

   What was already there and is reused: each salesman's own rate and his
   "On" setting (invoice value or collected money), and the Category and
   Sub category already carried by every item.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── the rate table. Blank salesman = applies to everyone. ── */
L.commr = { t:'Commission rules',
 sub:'What the rate is, by what was sold — the most specific rule wins',
 add:'commrf', addT:'New rule', tools:['Excel','Print'],
 cols:[C('Salesman'),C('Category'),C('Sub category'),n('Rate %'),C('Applies to'),C('From'),C('Status'),C('')],
 rows:[
  ['<span class="mu">All salesmen</span>','Laptops','Open box','3.00','The sub category','01/01/2026','<span class="pill ok">Active</span>',del()],
  ['<span class="mu">All salesmen</span>','Laptops','<span class="mu">All</span>','2.00','The category','01/01/2026','<span class="pill ok">Active</span>',del()],
  ['<span class="mu">All salesmen</span>','Solar','<span class="mu">All</span>','3.50','The category','01/01/2026','<span class="pill ok">Active</span>',del()],
  ['<span class="mu">All salesmen</span>','Paper','<span class="mu">All</span>','1.00','The category','01/01/2026','<span class="pill ok">Active</span>',del()],
  ['<span class="mu">All salesmen</span>','Services','<span class="mu">All</span>','5.00','The category','01/01/2026','<span class="pill ok">Active</span>',del()]
 ]};

/* ── the lines behind the commission: what each salesman sold, by category.
      These add up to the "Sales this month" and "Collected" already shown on
      the Salesmen screen, so the two screens cannot disagree. ── */
const COMMLINES = [
 { s:'Elie Haddad',     cat:'Laptops',  sub:'New',      value:14200, collected:11000 },
 { s:'Elie Haddad',     cat:'Laptops',  sub:'Open box', value:4200,  collected:3200 },
 { s:'Elie Haddad',     cat:'Solar',    sub:'—',        value:14200, collected:11000 },
 { s:'Elie Haddad',     cat:'Paper',    sub:'—',        value:3520,  collected:2700 },
 { s:'Elie Haddad',     cat:'Services', sub:'—',        value:2000,  collected:1500 },
 { s:'Nabil Aoun',      cat:'Laptops',  sub:'New',      value:9880,  collected:9880 },
 { s:'Nabil Aoun',      cat:'Solar',    sub:'—',        value:12000, collected:12000 },
 { s:'Nabil Aoun',      cat:'Paper',    sub:'—',        value:1800,  collected:1800 },
 { s:'Nabil Aoun',      cat:'Services', sub:'—',        value:1200,  collected:1200 },
 { s:'Direct business', cat:'Laptops',  sub:'New',      value:12400, collected:12400 },
 { s:'Direct business', cat:'Laptops',  sub:'Open box', value:2096,  collected:2096 },
 { s:'Direct business', cat:'Solar',    sub:'—',        value:35188, collected:35188 },
 { s:'Direct business', cat:'Paper',    sub:'—',        value:9536,  collected:9536 },
 { s:'Direct business', cat:'Services', sub:'—',        value:2000,  collected:2000 }
];

/* the most specific rule wins: sub category, then category, then the
   salesman's own rate as the fallback */
function commRate(cat, sub){
 const rows = (L.commr.rows || []).map(r => ({
   cat: cellText(r[1]), sub: cellText(r[2]), rate: parseFloat(cellText(r[3])),
   live: /active/i.test(cellText(r[6])) }));
 let hit = rows.find(r => r.live && r.cat === cat && r.sub === sub);
 if(hit) return { rate:hit.rate, why: cat + ' / ' + sub };
 hit = rows.find(r => r.live && r.cat === cat && /^all$/i.test(r.sub));
 if(hit) return { rate:hit.rate, why: cat };
 return null;
}
function commFor(name){
 const i = (L.sman.rows || []).find(r => cellText(r[colIdx('sman','Name')]) === name);
 if(!i) return null;
 return { pct: parseFloat(cellText(i[colIdx('sman','Commission %')])) || 0,
          on: cellText(i[colIdx('sman','On')]) };
}

S.commd = function(){
 const f2 = v => v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
 const names = [...new Set(COMMLINES.map(l => l.s))];
 let body = [], grand = 0, grandFlat = 0, excluded = [];

 names.forEach(nm => {
  const sm = commFor(nm);
  if(!sm){ return; }
  if(sm.on === '—' || sm.on === ''){ excluded.push(nm); return; }
  const mine = COMMLINES.filter(l => l.s === nm);
  let sub = 0, base0 = 0;
  mine.forEach(l => {
   const r = commRate(l.cat, l.sub);
   const base = /collected/i.test(sm.on) ? l.collected : l.value;
   base0 += base;
   const rate = r ? r.rate : sm.pct;
   const com = Math.round(base * rate) / 100;
   sub += com;
   body.push(['<b>' + esc(nm) + '</b>', esc(l.cat), l.sub === '—' ? '<span class="mu">—</span>' : esc(l.sub),
     f2(l.value), f2(l.collected), f2(rate) + '%',
     r ? '<span class="mu">' + esc(r.why) + '</span>' : pill('wa', tr('His own rate')),
     f2(base), '<b>' + f2(com) + '</b>']);
  });
  const flat = Math.round(base0 * sm.pct) / 100;
  grand += sub; grandFlat += flat;
  body.push(['<b>' + esc(nm) + ' — ' + tr('total') + '</b>','','','','','',
    '<span class="mu">' + esc(sm.on) + '</span>', '<b>' + f2(base0) + '</b>', '<b>' + f2(sub) + '</b>']);
 });
 body.push(['<b>' + tr('All salesmen') + '</b>','','','','','','','','<b>' + f2(grand) + '</b>']);

 return head('Commission due','Worked out line by line, at the rate for what was actually sold',
   [btn('This month','p'),btn('Last month'),btn('Print'),btn('Excel'),btn('PDF')]) +
  '<div class="g g3">' +
   kpi('Commission due', 'US$ ' + f2(grand), 'across ' + (names.length - excluded.length) + ' salesmen') +
   kpi('At one flat rate each', 'US$ ' + f2(grandFlat), 'what the old single rate would have paid') +
   kpi('Difference', (grand >= grandFlat ? '+' : '−') + 'US$ ' + f2(Math.abs(grand - grandFlat)),
       'because the rate follows what was sold', grand >= grandFlat ? 'u' : 'w') +
  '</div>' +
  pane(tr('Line by line'),
   tbl([C('Salesman'),C('Category'),C('Sub category'),n('Sales value'),n('Collected'),
        n('Rate'),C('Rule used'),n('Calculated on'),n('Commission')], body, { min:1240 })) +
  (excluded.length ? pane(tr('Not on commission'),
    dsState('empty', { title: excluded.join(', '),
      text: tr('This salesman has no “On” setting, so no commission is calculated. Shop and direct sales usually sit here.') })) : '') +
  note(tr('Every figure on this screen is calculated.'),
   'The rates come from Commission rules, the values from what each salesman sold by category, and each line is worked out at the rate for its own category — not one rate across the whole invoice. Change a rule and this screen changes with it.');
};

/* ── put both on the menu, beside the screens they belong with ── */
(function(){
 MENU.forEach(g => {
  const i = g.items.findIndex(x => x[0] === 'sman');
  if(i >= 0 && !g.items.some(x => x[0] === 'commr'))
   g.items.splice(i + 1, 0, ['commr','Commission rules','قواعد العمولة']);
  const j = g.items.findIndex(x => x[0] === 'prep');
  if(j >= 0 && !g.items.some(x => x[0] === 'commd'))
   g.items.splice(j + 1, 0, ['commd','Commission due','العمولة المستحقة']);
 });
})();

/* the form behind "New rule" */
Object.assign(F, { commrf:{ t:'New commission rule', s:[{ h:'The rule', c:2, f:[
  { l:'Salesman', t:'sel', o:['All salesmen','Elie Haddad','Nabil Aoun'] },
  { l:'Category', t:'sel', o:['Laptops','Solar','Paper','Services'], req:1 },
  { l:'Sub category', t:'sel', o:['All','New','Open box'] },
  { l:'Rate %', t:'num', req:1 },
  { l:'From', v:'01/01/2026', req:1 },
  { t:'note', v:'<b>The most specific rule wins.</b> A rule naming a sub category beats one naming only the category, and a category rule beats the salesman’s own single rate. Nothing is calculated on the invoice total any more — every line is rated on what it actually is.' }
]}]}});

/* a way into the rules from the salesman list */
S.sman = (orig => function(){
 return orig().replace('<div class="tools">','<div class="tools">' +
  '<button class="b" onclick="openTab(\'commr\',\'Commission rules\',\'قواعد العمولة\')">' +
  tr('Commission rules') + '</button>');
})(S.sman || function(){ return renderList('sman','Salesmen','المندوبون'); });

Object.assign(AR, { 'Commission rules':'قواعد العمولة', 'Commission due':'العمولة المستحقة',
 'Line by line':'سطراً بسطر', 'Not on commission':'بدون عمولة', 'His own rate':'معدله الخاص',
 'All salesmen':'كل المندوبين', 'total':'المجموع', 'Rule used':'القاعدة المستخدمة',
 'Sales value':'قيمة المبيعات', 'Collected':'المحصّل', 'Calculated on':'محسوبة على',
 'Commission':'العمولة', 'Every figure on this screen is calculated.':'كل رقم في هذه الشاشة محسوب.',
 'This salesman has no “On” setting, so no commission is calculated. Shop and direct sales usually sit here.':
   'هذا المندوب بلا إعداد «على»، لذلك لا تُحتسب عمولة. المبيعات المباشرة عادةً هنا.' });
Object.keys(AR).forEach(k => { if(!TT[k]) TT[k] = [k, AR[k]]; });
buildTree(); paint();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   CR-004 — SALES MANAGER

   The client: "we have sales manager in some companies".

   A level above salesman. The manager has a team, sees what his team sells,
   and earns an override on it. "Some companies" is the important word — a
   salesman may report to nobody, and the shop counter does, so the hierarchy
   is optional rather than imposed.

   This reuses the commission engine built for CR-005 rather than adding a
   second one: the team's own commission is still calculated line by line at
   the category rate. The override is the one new idea, and it is a flat rate
   on what the team sold, which is how an override normally works.
   ═══════════════════════════════════════════════════════════════════════ */
(function(){
 const d = L.sman;
 if(!d || d.cols.some(c => c && c.h === 'Role')) return;         /* only once */

 /* the three new columns go in front of the row-action column */
 const at = d.cols.length - 1;
 d.cols.splice(at, 0, C('Role'), C('Reports to'), n('Override on team %'));
 const add = (row, role, reportsTo, override) => { row.splice(at, 0, role, reportsTo, override); };

 d.rows.forEach(r => {
  const name = cellText(r[colIdx('sman','Name')]);
  if(name === 'Direct business') add(r, 'Salesman', '<span class="mu">—</span>', '<span class="mu">—</span>');
  else add(r, 'Salesman', 'Sami Rizk', '<span class="mu">—</span>');
 });

 /* the manager himself — a salesman record with a role, not a new kind of thing */
 const mgr = [];
 d.cols.forEach(c => mgr.push(''));
 const set = (h, v) => { const i = colIdx('sman', h); if(i >= 0) mgr[i] = v; };
 set('Code','SM-00'); set('Name','Sami Rizk'); set('Arabic name','سامي رزق');
 set('Phone','+961 3 118 442'); set('Areas','Bekaa · Beirut');
 set('Commission %','1.00'); set('On','Invoice value'); set('Max discount','8%');
 set('Van warehouse','<span class="mu">—</span>');
 set('Sales this month','0.00'); set('Collected','0.00');
 set('Role','<span class="pill in">Sales manager</span>');
 set('Reports to','<span class="mu">—</span>'); set('Override on team %','0.50');
 set('Status','<span class="pill ok">Active</span>');
 mgr[mgr.length - 1] = del();
 d.rows.unshift(mgr);
})();

/* who reports to whom */
function smanRow(name){
 return (L.sman.rows || []).find(r => cellText(r[colIdx('sman','Name')]) === name) || null;
}
function smanField(name, header){
 const r = smanRow(name); if(!r) return '';
 const i = colIdx('sman', header); return i < 0 ? '' : cellText(r[i]);
}
function teamOf(manager){
 return (L.sman.rows || [])
  .filter(r => cellText(r[colIdx('sman','Reports to')]) === manager)
  .map(r => cellText(r[colIdx('sman','Name')]));
}
function managers(){
 return (L.sman.rows || [])
  .filter(r => /manager/i.test(cellText(r[colIdx('sman','Role')])))
  .map(r => cellText(r[colIdx('sman','Name')]));
}

/* ── Commission due gains the manager roll-up. The per-line engine is the
      one built for CR-005 — nothing about it changes. ── */
S.commd = (orig => function(){
 let html = orig();
 const f2 = v => v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
 const mgrs = managers();
 if(!mgrs.length) return html;

 let rows = [], grand = 0;
 mgrs.forEach(m => {
  const team = teamOf(m);
  const on = smanField(m, 'On');
  const ov = parseFloat(smanField(m, 'Override on team %')) || 0;
  let teamValue = 0, teamCollected = 0;
  team.forEach(t => {
   COMMLINES.filter(l => l.s === t).forEach(l => { teamValue += l.value; teamCollected += l.collected; });
  });
  const base = /collected/i.test(on) ? teamCollected : teamValue;
  const com = Math.round(base * ov) / 100;
  grand += com;
  team.forEach(t => {
   const v = COMMLINES.filter(l => l.s === t).reduce((a,l) => a + l.value, 0);
   const c = COMMLINES.filter(l => l.s === t).reduce((a,l) => a + l.collected, 0);
   rows.push(['<b>' + esc(m) + '</b>', esc(t), f2(v), f2(c),
     '<span class="mu">' + tr('in his team') + '</span>', '', '']);
  });
  rows.push(['<b>' + esc(m) + ' — ' + tr('override') + '</b>',
    '<span class="mu">' + team.length + ' ' + tr(team.length === 1 ? 'salesman' : 'salesmen') + '</span>',
    '<b>' + f2(teamValue) + '</b>', '<b>' + f2(teamCollected) + '</b>',
    '<span class="mu">' + esc(on) + '</span>', f2(ov) + '%', '<b>' + f2(com) + '</b>']);
 });
 rows.push(['<b>' + tr('All managers') + '</b>','','','','','','<b>' + f2(grand) + '</b>']);

 const block = pane(tr('Managers — override on what their team sold'),
   tbl([C('Manager'),C('Salesman'),n('Team sales'),n('Team collected'),
        C('Calculated on'),n('Override'),n('Commission')], rows, { min:980 }) +
   note(tr('An override is a flat rate on the team, not a second category calculation.'),
     'The team’s own commission above is still worked out line by line at the rate for each category. The manager earns his override on the total his team brought in. If a manager also sells himself, those sales are rated exactly like any salesman’s.'));

 /* directly after the line-by-line pane. The markers are language-independent:
    .dsst is the not-on-commission empty state, .note is the closing note. */
 let ins = -1;
 const ds = html.indexOf('<div class="dsst"');
 if(ds > 0) ins = html.lastIndexOf('<div class="pane">', ds);
 if(ins < 0) ins = html.lastIndexOf('<div class="note">');
 return ins < 0 ? html + block : html.slice(0, ins) + block + html.slice(ins);
})(S.commd);

/* the manager total belongs in the headline figure too */
S.commd = (orig => function(){
 let html = orig();
 const f2 = v => v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
 let mgrTotal = 0;
 managers().forEach(m => {
  const on = smanField(m,'On'), ov = parseFloat(smanField(m,'Override on team %')) || 0;
  let v = 0, c = 0;
  teamOf(m).forEach(t => COMMLINES.filter(l => l.s === t).forEach(l => { v += l.value; c += l.collected; }));
  mgrTotal += Math.round((/collected/i.test(on) ? c : v) * ov) / 100;
 });
 if(!mgrTotal) return html;
 return html.replace(/(<div class="kpi"><div class="k">[^<]*<\/div><div class="v">US\$ )([\d,\.]+)/,
   (m0, pre, num) => pre + f2(parseFloat(num.replace(/,/g,'')) + mgrTotal))
  .replace(/across (\d+) salesmen/, 'across $1 salesmen and ' + managers().length + ' manager');
})(S.commd);

/* the team, on the salesmen screen */
S.sman = (orig => function(){
 let html = orig();
 const mgrs = managers();
 if(!mgrs.length) return html;
 const rows = [];
 mgrs.forEach(m => {
  const team = teamOf(m);
  rows.push(['<b>' + esc(m) + '</b>', '<span class="pill in">' + tr('Sales manager') + '</span>',
    esc(smanField(m,'Areas')), '<b>' + team.length + '</b>']);
  team.forEach(t => rows.push(['<span class="mu">↳</span> ' + esc(t),
    '<span class="mu">' + tr('Salesman') + '</span>', esc(smanField(t,'Areas')), '']));
 });
 const loose = (L.sman.rows || [])
   .filter(r => cellText(r[colIdx('sman','Reports to')]) === '—' && !/manager/i.test(cellText(r[colIdx('sman','Role')])))
   .map(r => cellText(r[colIdx('sman','Name')]));
 loose.forEach(t => rows.push([esc(t), '<span class="mu">' + tr('Salesman') + '</span>',
   esc(smanField(t,'Areas')), '<span class="mu">' + tr('reports to nobody') + '</span>']));
 return html + pane(tr('The sales team'),
   tbl([C('Name'),C('Role'),C('Areas'),C('Team')], rows, { min:640 }) +
   note(tr('A manager is optional.'),
     'Some of your companies have one and some do not, so a salesman may report to nobody. The shop counter usually does.'));
})(S.sman);

/* the salesman form learns the two new fields */
(function(){
 const f = F.sman; if(!f || f.__mgr) return; f.__mgr = 1;
 const sec = f.s && f.s[0];
 if(sec && sec.f) sec.f.push(
   { l:'Role', t:'sel', o:['Salesman','Sales manager'] },
   { l:'Reports to', t:'sel', o:['Nobody','Sami Rizk'] },
   { l:'Override on team %', t:'num', hint:'Only for a manager — the flat rate he earns on what his team sells.' });
})();

Object.assign(AR, { 'Sales manager':'مدير مبيعات', 'Salesman':'مندوب', 'Reports to':'يتبع',
 'Override on team %':'نسبة الإشراف على الفريق %', 'The sales team':'فريق المبيعات',
 'Managers — override on what their team sold':'المدراء — نسبة الإشراف على ما باعه فريقهم',
 'in his team':'ضمن فريقه', 'override':'الإشراف', 'All managers':'كل المدراء',
 'Team sales':'مبيعات الفريق', 'Team collected':'محصّل الفريق', 'Override':'الإشراف',
 'salesman':'مندوب', 'salesmen':'مندوبين', 'Team':'الفريق', 'Role':'الدور',
 'reports to nobody':'لا يتبع أحداً', 'A manager is optional.':'وجود المدير اختياري.',
 'An override is a flat rate on the team, not a second category calculation.':
   'نسبة الإشراف نسبة ثابتة على الفريق، وليست حساباً ثانياً حسب الفئة.' });
Object.keys(AR).forEach(k => { if(!TT[k]) TT[k] = [k, AR[k]]; });
buildTree(); paint();
</script>
