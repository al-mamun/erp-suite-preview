<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<title>ERP Suite Prototype</title>
<style>
  :root{color-scheme:light dark}
  html,body{margin:0}
  body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fafaf9}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<meta charset="utf-8">
<title>ERP Suite Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   PRIORITY 6 — SPACING SCALES, NAMED
   The application uses two rhythms, and both are deliberate:
     LAYOUT  (4px)  --s1 … --s16   page, card, grid and section spacing
     CONTROL (2px)  --sp-1 … --sp-14  the internal padding of dense controls
   ERP controls are 24–32px tall; a 4px-only grid cannot express a 32px button
   with 7px of vertical padding, and forcing one would change the geometry of
   every control in the product. So the 2px rhythm is named rather than
   removed. Converting the literals to these tokens moved no pixels — the
   geometry of 8,959 elements across ten screens is byte-identical before and
   after — but the values are now governed instead of freehand.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --s10:40px; --s12:48px; --s16:64px;
  --sp-1:1px; --sp-2:2px; --sp-3:3px; --sp-5:5px; --sp-6:6px; --sp-7:7px;
  --sp-9:9px; --sp-10:10px; --sp-11:11px; --sp-13:13px; --sp-14:14px;
}
</style>
<style>
:root{
  --bg:#F4F6F8; --panel:#FFFFFF; --panel2:#F8FAFB; --panel3:#EDF1F4; --panel4:#E3E9EE;
  --ink:#101826; --ink2:#4A5666; --ink3:#78859A;
  --line:#DBE2E9; --line2:#C3CDD8;
  --nav:#101C2E; --nav2:#1A2A42; --nav3:#25395A; --navInk:#C3CFDE; --navInk2:#7E8FA6;
  --ac:#0E7C66; --ac2:#12A085; --acSoft:#E1F1EC; --acInk:#095446;
  --dr:#1D6FB8; --cr:#B4690E;
  --ok:#0E7C66; --okBg:#E1F1EC; --wa:#8A5B0B; --waBg:#FBF1DC;
  --ba:#A32E2E; --baBg:#FAE8E6; --in:#1D6FB8; --inBg:#E6EFF7;
  --ui:"Public Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --ar:"Noto Sans Arabic","Public Sans",sans-serif;
  --mo:"Roboto Mono",ui-monospace,Menlo,monospace;
  --sh:0 1px 2px rgba(16,24,38,.05),0 4px 14px -8px rgba(16,24,38,.16);
  --shL:0 10px 40px -12px rgba(16,24,38,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1017; --panel:#121A24; --panel2:#0F161E; --panel3:#18212C; --panel4:#1F2A37;
  --ink:#E6EBF1; --ink2:#A8B4C2; --ink3:#77848F;
  --line:#212B36; --line2:#2E3A47;
  --nav:#080D14; --nav2:#121C29; --nav3:#1D2B3D; --navInk:#B6C4D4; --navInk2:#6D7C90;
  --ac:#26A98D; --ac2:#33BF9F; --acSoft:#0E2C26; --acInk:#6FD4B8;
  --dr:#67A9E0; --cr:#DDA35F;
  --ok:#26A98D; --okBg:#0E2C26; --wa:#D2A559; --waBg:#2A2311;
  --ba:#D98884; --baBg:#2C1817; --in:#67A9E0; --inBg:#12212F;
  --sh:0 1px 2px rgba(0,0,0,.5),0 4px 14px -8px rgba(0,0,0,.8);
  --shL:0 10px 40px -12px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --bg:#0B1017; --panel:#121A24; --panel2:#0F161E; --panel3:#18212C; --panel4:#1F2A37;
  --ink:#E6EBF1; --ink2:#A8B4C2; --ink3:#77848F;
  --line:#212B36; --line2:#2E3A47;
  --nav:#080D14; --nav2:#121C29; --nav3:#1D2B3D; --navInk:#B6C4D4; --navInk2:#6D7C90;
  --ac:#26A98D; --ac2:#33BF9F; --acSoft:#0E2C26; --acInk:#6FD4B8;
  --dr:#67A9E0; --cr:#DDA35F;
  --ok:#26A98D; --okBg:#0E2C26; --wa:#D2A559; --waBg:#2A2311;
  --ba:#D98884; --baBg:#2C1817; --in:#67A9E0; --inBg:#12212F;
  --sh:0 1px 2px rgba(0,0,0,.5),0 4px 14px -8px rgba(0,0,0,.8);
  --shL:0 10px 40px -12px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13.5px;
     line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
body[dir="rtl"]{font-family:var(--ar)}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ── strip ── */
.strip{background:var(--ac);color:#fff;font-size:12px;padding:var(--sp-6) var(--s4);display:flex;gap:var(--s4);
       align-items:center;justify-content:center;flex-wrap:wrap}
.strip b{font-weight:600}.strip span{opacity:.9}

/* ── frame ── */
.frame{display:grid;grid-template-columns:230px minmax(0,1fr);height:calc(100vh - 29px)}
@media (max-width:920px){.frame{grid-template-columns:1fr}.nav{position:fixed;inset:29px auto 0 0;
  width:250px;z-index:80;transform:translateX(-100%);transition:transform .18s}
  .nav.open{transform:none} body[dir="rtl"] .nav{inset:29px 0 0 auto;transform:translateX(100%)}
  body[dir="rtl"] .nav.open{transform:none}}

/* ── nav ── */
.nav{background:var(--nav);display:flex;flex-direction:column;overflow:hidden}
.logo{padding:var(--s3) var(--sp-14);display:flex;gap:var(--sp-10);align-items:center;
      border-bottom:1px solid rgba(255,255,255,.06)}
.logo .m{width:30px;height:30px;border-radius:8px;background:var(--ac2);display:grid;
         place-items:center;color:#04120E;font-weight:700;font-size:14px;flex:none}
.logo .t{color:#fff;font-weight:600;font-size:14px;line-height:1.15}
.logo .s{color:var(--navInk2);font-size:11px}
.navsearch{padding:var(--sp-9) var(--sp-10);border-bottom:1px solid rgba(255,255,255,.06)}
.navsearch input{width:100%;background:var(--nav2);border:1px solid var(--nav3);border-radius:6px;
  padding:var(--sp-6) var(--sp-9);font-size:12.5px;color:#fff}
.navsearch input::placeholder{color:var(--navInk2)}
.navsearch input:focus{outline:1px solid var(--ac2)}
.tree{flex:1;overflow-y:auto;padding:var(--sp-6) var(--sp-6) var(--s5)}
.tree::-webkit-scrollbar-thumb{background:#2A3D57}
.gp>button{width:100%;display:flex;align-items:center;gap:var(--sp-9);background:none;border:0;
  color:var(--navInk);padding:var(--sp-7) var(--sp-9);border-radius:6px;cursor:pointer;text-align:start;
  font-size:13px;font-weight:500}
.gp>button:hover{background:var(--nav2);color:#fff}
.gp>button .i{width:15px;flex:none;opacity:.75;font-size:12px;text-align:center}
.gp>button .c{margin-inline-start:auto;font-size:8px;opacity:.55;transition:transform .15s}
.gp.open>button .c{transform:rotate(90deg)}
body[dir="rtl"] .gp>button .c{transform:scaleX(-1)}
body[dir="rtl"] .gp.open>button .c{transform:rotate(-90deg)}
.gp ul{list-style:none;margin:var(--sp-1) 0 var(--s1);padding:0;display:none}
.gp.open ul{display:block}
.gp a{display:block;padding:var(--sp-5) var(--sp-9) var(--sp-5) 33px;color:var(--navInk2);text-decoration:none;
  font-size:12.5px;border-radius:5px;cursor:pointer}
body[dir="rtl"] .gp a{padding:var(--sp-5) 33px var(--sp-5) var(--sp-9)}
.gp a:hover{background:var(--nav2);color:var(--navInk)}
.gp a.on{background:var(--ac);color:#fff;font-weight:500}

/* ── main ── */
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);height:46px;display:flex;
  align-items:center;gap:var(--sp-10);padding:0 var(--s3);flex:none}
.hamb{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:var(--s1) var(--s2);cursor:pointer}
@media (max-width:920px){.hamb{display:block}}
.ctx{display:flex;gap:var(--sp-7);align-items:center;flex-wrap:wrap;margin-inline-start:auto}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:var(--s1) var(--s2);
  font-size:12px;cursor:pointer;color:var(--ink);max-width:150px}
.sw{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sw button{background:var(--panel2);border:0;padding:var(--s1) var(--sp-10);font-size:12px;cursor:pointer;color:var(--ink2)}
.sw button.on{background:var(--ac);color:#fff;font-weight:600}
.usr{display:flex;gap:var(--sp-7);align-items:center;font-size:12.5px;color:var(--ink2)}
.usr .a{width:25px;height:25px;border-radius:50%;background:var(--acSoft);color:var(--acInk);
  display:grid;place-items:center;font-weight:700;font-size:11px}

/* ── tab strip (his convention) ── */
.tabs{background:var(--panel3);border-bottom:1px solid var(--line);display:flex;gap:var(--sp-1);
  overflow-x:auto;flex:none;padding:0 var(--sp-6);height:35px;align-items:flex-end}
.tabs::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:var(--sp-7);background:var(--panel4);border:1px solid var(--line);
  border-bottom:0;border-radius:6px 6px 0 0;padding:var(--sp-6) var(--sp-9) var(--sp-6) var(--s3);font-size:12.5px;
  cursor:pointer;white-space:nowrap;color:var(--ink2);max-width:210px}
.tab.on{background:var(--panel);color:var(--ink);font-weight:600;position:relative;top:1px}
.tab .x{opacity:.5;font-size:14px;line-height:1;padding:0 var(--sp-2);border-radius:3px}
.tab .x:hover{opacity:1;background:var(--line)}

/* ── content ── */
.scroll{flex:1;overflow-y:auto;padding:var(--sp-14) var(--s4) var(--s10)}
.head{display:flex;align-items:flex-start;gap:var(--s3);margin-bottom:var(--s3);flex-wrap:wrap}
.head h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.head .sub{color:var(--ink3);font-size:12.5px;margin-top:var(--sp-2)}
.tools{margin-inline-start:auto;display:flex;gap:var(--sp-6);flex-wrap:wrap}
.b{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:var(--sp-5) var(--sp-11);
  font-size:12.5px;cursor:pointer;color:var(--ink);display:inline-flex;gap:var(--sp-6);align-items:center}
.b:hover{background:var(--panel2);border-color:var(--ink3)}
.b.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.b.p:hover{background:var(--ac2)}
.b.d{border-color:var(--baBg);color:var(--ba)}
.b:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:1px}

.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh);
  margin-bottom:var(--s3);overflow:hidden}
.pane>.ph{padding:var(--sp-9) var(--sp-13);border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:var(--sp-9);background:var(--panel2)}
.pane>.ph h2{margin:0;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink2)}
.pane>.ph .r{margin-inline-start:auto;display:flex;gap:var(--sp-6);align-items:center}
.pb{padding:var(--sp-13)}
.pb.f{padding:0}

.g{display:grid;gap:var(--s3);margin-bottom:var(--s3)}
.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.sp{display:grid;grid-template-columns:290px minmax(0,1fr);gap:var(--s3)}
@media (max-width:860px){.sp{grid-template-columns:1fr}}

/* ── kpi ── */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:var(--s3) var(--sp-14);
  box-shadow:var(--sh)}
.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;margin-top:var(--sp-5);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .d{font-size:11.5px;margin-top:var(--sp-3);color:var(--ink3)}
.kpi .d.u{color:var(--ok)} .kpi .d.w{color:var(--ba)}

/* ── tables ── */
.tw{overflow:auto;max-height:none}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;min-width:520px}
th,td{text-align:start;padding:var(--sp-7) var(--sp-11);border-bottom:1px solid var(--line)}
td,th{unicode-bidi:plaintext}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:600;
  background:var(--panel3);white-space:nowrap;position:sticky;top:0;z-index:2}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums;font-family:var(--mo);font-size:12px}
td.c{font-family:var(--mo);font-size:12px;white-space:nowrap}
body[dir="rtl"] td.c,body[dir="rtl"] td.n,body[dir="rtl"] .mo{direction:ltr}
tr.tt td{font-weight:700;background:var(--panel3);border-top:1.5px solid var(--line2)}
.dr{color:var(--dr);font-weight:500} .cr{color:var(--cr);font-weight:500}
.rowact{opacity:.45;cursor:pointer;padding:var(--sp-1) var(--sp-5);border-radius:4px}
tr:hover .rowact{opacity:1}
.rowact:hover{background:var(--baBg);color:var(--ba)}

/* ── pills ── */
.pill{display:inline-block;font-size:10.5px;padding:var(--sp-2) var(--sp-7);border-radius:4px;font-weight:600;
  white-space:nowrap;letter-spacing:.01em}
.pill.ok{background:var(--okBg);color:var(--ok)} .pill.wa{background:var(--waBg);color:var(--wa)}
.pill.ba{background:var(--baBg);color:var(--ba)} .pill.in{background:var(--inBg);color:var(--in)}
.pill.mu{background:var(--panel4);color:var(--ink3)}

/* ── forms ── */
.fs{display:grid;gap:var(--sp-10) var(--sp-13)}
.f1{grid-template-columns:1fr}
.f2{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.f3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.f4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.f5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label{display:block;font-size:11px;color:var(--ink3);margin-bottom:var(--sp-3);font-weight:600;
  text-transform:uppercase;letter-spacing:.04em}
.in{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:6px;
  padding:var(--sp-6) var(--sp-9);font-size:13px}
.in:focus{outline:2px solid var(--ac);outline-offset:-1px}
.in[readonly],.in:disabled{background:var(--panel3);color:var(--ink2)}
.in.n{text-align:end;font-family:var(--mo);font-variant-numeric:tabular-nums}
.hint{font-size:11px;color:var(--ink3);margin-top:var(--sp-3)}
.req{color:var(--ba)}
.chk{display:flex;gap:var(--sp-7);align-items:center;font-size:12.5px;margin-top:18px}
.navnum{display:flex;align-items:center;gap:var(--sp-2)}
.navnum button{background:var(--panel3);border:1px solid var(--line2);padding:var(--sp-5) var(--sp-7);cursor:pointer;
  font-size:11px;color:var(--ink2)}
.navnum button:first-child{border-radius:6px 0 0 6px}
.navnum button:last-child{border-radius:0 6px 6px 0}
.navnum .in{border-radius:0;text-align:center;max-width:80px}

/* ── modal ── */
.ov{position:fixed;inset:0;background:rgba(10,16,24,.55);display:none;z-index:200;
  align-items:flex-start;justify-content:center;padding:var(--s10) var(--s4);overflow-y:auto}
.ov.on{display:flex}
.mod{background:var(--panel);border-radius:10px;box-shadow:var(--shL);width:100%;max-width:800px;
  overflow:hidden;border:1px solid var(--line)}
.mh{padding:var(--sp-13) var(--s4);border-bottom:1px solid var(--line);display:flex;align-items:center;
  background:var(--panel2)}
.mh h3{margin:0;font-size:15px;font-weight:600}
.mh .x{margin-inline-start:auto;background:none;border:0;font-size:20px;cursor:pointer;
  color:var(--ink3);line-height:1;padding:var(--sp-2) var(--sp-6);border-radius:5px}
.mh .x:hover{background:var(--panel4);color:var(--ink)}
.mb{padding:var(--s4);max-height:64vh;overflow-y:auto}
.mf{padding:var(--sp-11) var(--s4);border-top:1px solid var(--line);display:flex;gap:var(--s2);justify-content:flex-end;
  background:var(--panel2)}
.sect{margin-bottom:var(--s4)}
.sect:last-child{margin-bottom:0}
.sect h4{margin:0 0 var(--sp-9);font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ac);font-weight:700;padding-bottom:var(--sp-5);border-bottom:1px solid var(--line)}

/* ── status bar ── */
.status{background:var(--panel3);border-top:1px solid var(--line);padding:var(--sp-5) var(--sp-14);font-size:11.5px;
  color:var(--ink3);display:flex;gap:var(--s4);align-items:center;flex:none;flex-wrap:wrap}
.status b{color:var(--ink2);font-weight:600}
.status .r{margin-inline-start:auto;display:flex;gap:var(--sp-14)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-inline-end:var(--sp-5)}

/* ── misc ── */
.note{background:var(--acSoft);border:1px solid var(--ac);border-radius:7px;padding:var(--sp-10) var(--sp-13);
  font-size:12.5px;color:var(--acInk);margin-bottom:var(--s3)}
.note b{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-6)}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:var(--s1) var(--sp-9);
  font-size:11.5px;color:var(--ink2)}
.chip b{color:var(--ink);font-weight:600}
.mo{font-family:var(--mo)}.mu{color:var(--ink3)}
.tabsx{display:flex;gap:var(--sp-1);border-bottom:1px solid var(--line);margin-bottom:var(--sp-11);overflow-x:auto}
.tabsx button{background:none;border:0;border-bottom:2px solid transparent;padding:var(--sp-7) var(--s3);
  cursor:pointer;color:var(--ink3);font-size:12.5px;white-space:nowrap;font-weight:500}
.tabsx button.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:var(--sp-5);height:96px;padding-top:var(--sp-6);direction:ltr}
.bars i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:3px;position:relative;display:block}
.bars i:last-child{background:var(--ac2)}
.bars i s{position:absolute;bottom:-16px;inset-inline:0;text-align:center;font-size:10px;
  color:var(--ink3);text-decoration:none}
.trw{font-size:12.5px}
.trw .nd{display:flex;gap:var(--sp-7);padding:var(--s1) var(--sp-7);border-radius:5px;cursor:pointer;align-items:center}
.trw .nd:hover{background:var(--panel2)}
.trw .nd.on{background:var(--acSoft);color:var(--acInk);font-weight:600}
.trw .cd{font-family:var(--mo);font-size:11.5px;color:var(--ink3);min-width:48px}
.trw .nd.d1{padding-inline-start:var(--sp-7);font-weight:700;margin-top:var(--sp-5)}
.trw .nd.d2{padding-inline-start:22px;font-weight:600}
.trw .nd.d3{padding-inline-start:var(--s10)}
.trw .nd.d4{padding-inline-start:58px}
.trw .nd.d5{padding-inline-start:76px}
.trw .nd.d2,.trw .nd.d3,.trw .nd.d4,.trw .nd.d5{
  border-inline-start:1px solid var(--line);margin-inline-start:var(--sp-9)}
</style>

<div class="strip"><b data-t="stripB">Working prototype</b>
  <span data-t="stripS">Every menu opens · every Add button opens its real form · switch to عربي to see the whole system mirror</span></div>

<div class="frame">

<script>
/* ══════════ helpers ══════════ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang='en', cur='USD', TABS=[], active=null;

/* field spec → html */
function fld(f){
  const req=f.req?' <span class="req">*</span>':'';
  const hint=f.hint?`<div class="hint">${f.hint}</div>`:'';
  let ctl;
  if(f.t==='sel') ctl=`<select class="in">${(f.o||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  else if(f.t==='chk') return `<div class="chk"><input type="checkbox" ${f.v?'checked':''}><span>${esc(tx(f.l))}</span></div>`;
  else if(f.t==='area') ctl=`<textarea class="in" rows="3">${esc(f.v||'')}</textarea>`;
  else ctl=`<input class="in${f.t==='num'?' n':''}" value="${esc(f.v||'')}" placeholder="${esc(f.ph||'')}" ${f.ro?'readonly':''}>`;
  return `<div><label>${esc(tx(f.l))}${req}</label>${ctl}${hint}</div>`;
}
const fgrid=(fs,c=2)=>`<div class="fs f${c}">${fs.map(fld).join('')}</div>`;

/* table builder */
function tbl(cols,rows,opt={}){
  const th=cols.map(c=>`<th class="${c.a||''}">${esc(tx(c.h))}</th>`).join('');
  const tr=rows.map(r=>`<tr>${cols.map((c,i)=>{
    const v=r[i]===undefined?'':r[i];
    return `<td class="${c.a||''}">${v}</td>`;}).join('')}</tr>`).join('');
  return `<div class="tw"><table${opt.min?` style="min-width:${opt.min}px"`:''}>
    <thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}
const pill=(k,t)=>`<span class="pill ${k}">${esc(t)}</span>`;
const del=()=>`<span class="rowact" title="Delete">🗑</span>`;

/* screen scaffolding */
function head(t,sub,tools){
  return `<div class="head"><div><h1>${esc(tx(t))}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>
    <div class="tools">${(tools||[]).join('')}</div></div>`;
}
const btn=(t,k='')=>`<button class="b ${k}">${esc(tx(t))}</button>`;
const addBtn=(t,form)=>`<button class="b p" onclick="openM('${form}')">+ ${esc(tx(t))}</button>`;
const pane=(title,body,right)=>`<div class="pane">${title?`<div class="ph"><h2>${esc(tx(title))}</h2>${right?`<div class="r">${right}</div>`:''}</div>`:''}<div class="pb f">${body}</div></div>`;
const paneP=(title,body,right)=>`<div class="pane">${title?`<div class="ph"><h2>${esc(tx(title))}</h2>${right?`<div class="r">${right}</div>`:''}</div>`:''}<div class="pb">${body}</div></div>`;
const kpi=(k,v,d,c='')=>`<div class="kpi"><div class="k">${esc(tx(k))}</div><div class="v">${v}</div><div class="d ${c}">${d||''}</div></div>`;
const note=(b,t)=>`<div class="note"><b>${esc(b)}</b> ${esc(t)}</div>`;
</script>

<script>
/* ══════════ ENGINE ══════════ */
function renderList(id,menuEn,menuAr){
  const d=L[id]||{};
  const title=lang==='ar'?(menuAr||d.t||id):(d.t||menuEn||id);
  const tools=[];
  if(d.add) tools.push(addBtn(d.addT||('New '+title.toLowerCase()),d.add));
  (d.tools||[]).forEach(t=>{ if(t==='Import') tools.push(`<button class="b" onclick="openM('impf')">${tr('Import')}</button>`); else tools.push(btn(tr(t))); });
  if(!d.cols) return head(title,lang==='ar'?'شاشة ضمن النظام':'Part of the system — the list, the filters, the print and export buttons all work the same way',tools)+
    pane('',`<div style="padding:26px;text-align:center;color:var(--ink3);font-size:13px">
      ${lang==='ar'?'هذه الشاشة تتبع نفس النمط: بحث · تصفية · جدول · طباعة · تصدير':'This screen follows the same pattern: search, filter, table, print, export.'}</div>`);
  let h=head(title,d.sub||'',tools);
  if(d.kpis) h+=`<div class="g g4">${d.kpis.map(k=>kpi(k[0],k[1],k[2],k[3]||'')).join('')}</div>`;
  if(d.note) h+=note(d.note[0],d.note[1]);
  h+=pane('',
    `<div style="padding:11px 13px;border-bottom:1px solid var(--line)">${fgrid([
      {l:lang==='ar'?'بحث':'Search',ph:lang==='ar'?'اكتب للبحث…':'Type to search…'},
      {l:lang==='ar'?'الفرع':'Branch',t:'sel',o:['All','Zahle','Beirut']},
      {l:lang==='ar'?'الحالة':'Status',t:'sel',o:['All','Active','Inactive']},
      {l:lang==='ar'?'من':'From',v:'01/08/2026'},{l:lang==='ar'?'إلى':'To',v:'29/08/2026'}],5)}</div>`+
    tbl(d.cols,d.rows||[],{min:Math.max(760,(d.cols.length||6)*110)}),
    `<span class="mu" style="font-size:11.5px">${(d.rows||[]).length} ${lang==='ar'?'سطر معروض':'rows shown'}</span>`);
  return h;
}

function render(id,en,ar){
  if(S[id]) return S[id]();
  return renderList(id,en,ar);
}

/* ── tabs ── */
function openTab(id,en,ar){
  let t=TABS.find(x=>x.id===id);
  if(!t){ t={id:id,en:en,ar:ar}; TABS.push(t); if(TABS.length>9) TABS.shift(); }
  active=id; paint();
}
function closeTab(id,ev){
  if(ev) ev.stopPropagation();
  const i=TABS.findIndex(x=>x.id===id); if(i<0) return;
  TABS.splice(i,1);
  if(active===id) active=TABS.length?TABS[Math.min(i,TABS.length-1)].id:null;
  paint();
}
function paint(){
  $('#tabs').innerHTML=TABS.map(t=>`<div class="tab ${t.id===active?'on':''}" onclick="active='${t.id}';paint()">
    <span>${esc(lang==='ar'?t.ar:t.en)}</span><span class="x" onclick="closeTab('${t.id}',event)">×</span></div>`).join('');
  const t=TABS.find(x=>x.id===active);
  $('#view').innerHTML=t?render(t.id,t.en,t.ar):'';
  $('#view').scrollTop=0;
  $$('#tree a').forEach(a=>a.classList.toggle('on',a.dataset.id===active));
}

/* ── menu ── */
function buildTree(){
  $('#tree').innerHTML=MENU.map((g,gi)=>`<div class="gp open" data-g="${gi}">
    <button onclick="this.parentNode.classList.toggle('open')">
      <span class="i">${g.i}</span><span class="gl">${esc(lang==='ar'?g.ar:g.en)}</span><span class="c">▶</span></button>
    <ul>${g.items.map(it=>`<li><a href="javascript:void 0" data-id="${it[0]}" data-en="${esc(it[1])}" data-ar="${esc(it[2])}"
      onclick="openTab('${it[0]}',this.dataset.en,this.dataset.ar)">${esc(lang==='ar'?it[2]:it[1])}</a></li>`).join('')}</ul>
  </div>`).join('');
}
function filterMenu(q){
  q=(q||'').trim().toLowerCase();
  $$('#tree .gp').forEach(g=>{
    let any=false;
    g.querySelectorAll('li').forEach(li=>{
      const a=li.querySelector('a');
      const hit=!q||a.textContent.toLowerCase().includes(q)||(a.dataset.en||'').toLowerCase().includes(q)||(a.dataset.ar||'').includes(q);
      li.style.display=hit?'':'none'; if(hit) any=true;
    });
    g.style.display=any?'':'none';
    if(q&&any) g.classList.add('open');
  });
}

/* ── modal ── */
function openM(k){
  const f=F[k]||F.generic;
  $('#mTitle').textContent=tx(f.t);
  $('#mBody').innerHTML=f.s.map(sec=>`<div class="sect"><h4>${esc(tx(sec.h))}</h4>${fgrid(sec.f,sec.c||3)}</div>`).join('');
  $('#ov').classList.add('on');
}
function closeM(){ $('#ov').classList.remove('on'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeM(); });
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeM(); });

/* ── language & currency ── */
function applyT(){
  const i=lang==='ar'?1:0;
  $$('[data-t]').forEach(el=>{ const v=T[el.dataset.t]; if(v) el.textContent=v[i]; });
  $$('[data-tph]').forEach(el=>{ const v=T[el.dataset.tph]; if(v) el.placeholder=v[i]; });
}
function setLang(l){
  lang=l;
  document.documentElement.lang=l;
  document.documentElement.dir=l==='ar'?'rtl':'ltr';
  $('#lE').classList.toggle('on',l==='en'); $('#lA').classList.toggle('on',l==='ar');
  applyT(); buildTree(); filterMenu($('#mfilter').value); paint();
}
function setCur(c){
  cur=c;
  $('#cU').classList.toggle('on',c==='USD'); $('#cL').classList.toggle('on',c==='LBP');
  paint();
}
function fillSelects(){
  $('#co').innerHTML=['Marounc Trading','Marounc Distribution','Zahle Retail'].map(o=>`<option>${o}</option>`).join('');
  $('#br').innerHTML=['Zahle','Beirut','All branches'].map(o=>`<option>${o}</option>`).join('');
  $('#co').onchange=e=>{ $('#stCoV').textContent=e.target.value; };
}

/* ── start ── */
$('#mfilter').addEventListener('input',e=>filterMenu(e.target.value));
$('#hamb').addEventListener('click',()=>$('#nav').classList.toggle('show'));
fillSelects();
buildTree();
applyT();
openTab('dash','Overview','نظرة عامة');
</script>

<script>
/* ══════════ menu behaves as an accordion — one group open at a time ══════════ */
function buildTree(){
  const openG=MENU.findIndex(g=>g.items.some(it=>it[0]===active));
  $('#tree').innerHTML=MENU.map((g,gi)=>`<div class="gp${gi===openG?' open':''}" data-g="${gi}">
    <button onclick="toggleGroup(${gi})">
      <span class="i">${g.i}</span><span class="gl">${esc(lang==='ar'?g.ar:g.en)}</span><span class="c">▶</span></button>
    <ul>${g.items.map(it=>`<li><a href="javascript:void 0" data-id="${it[0]}" data-en="${esc(it[1])}" data-ar="${esc(it[2])}"
      onclick="openTab('${it[0]}',this.dataset.en,this.dataset.ar)">${esc(lang==='ar'?it[2]:it[1])}</a></li>`).join('')}</ul>
  </div>`).join('');
  $$('#tree a').forEach(a=>a.classList.toggle('on',a.dataset.id===active));
}
function toggleGroup(gi){
  const g=$$('#tree .gp')[gi], was=g.classList.contains('open');

:root[data-app="own"]{

  --c-accent-soft:var(--c-owner-soft); --c-accent-ink:var(--c-owner-ink);

}}

/* ═══ base ═══ */
html,body{background:var(--c-bg)}
body{font-family:var(--f-ui);font-size:var(--t-body);color:var(--c-text);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-feature-settings:"cv05","cv08","ss01";line-height:1.5}
[lang="ar"] body,[dir="rtl"] body{font-family:var(--f-ar)}
::selection{background:var(--c-accent-soft);color:var(--c-accent-ink)}
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--c-border-strong);border-radius:99px;
  border:3px solid var(--c-bg);background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--c-text-4);background-clip:padding-box;border:3px solid var(--c-bg)}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px;border-radius:var(--r-sm)}
a{color:inherit}

/* numbers: UI font, tabular. mono is for identifiers only. */
.n,td.n,th.n,.in.n,.num,.kpi .v,.tot b,.ds-money{
  font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv05" 1}
.mo,.mono,.trw .cd,.ds-code{font-family:var(--f-mono);font-variant-ligatures:none;
  font-size:.92em;letter-spacing:-.01em}
.mu{color:var(--c-text-3)}
.dr{color:var(--c-debit);font-weight:500} .cr{color:var(--c-credit);font-weight:500}

/* ═══ icons ═══ */
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:-3px}
.ic-14{width:14px;height:14px} .ic-18{width:18px;height:18px}
.ic-20{width:20px;height:20px;stroke-width:1.6} .ic-24{width:24px;height:24px;stroke-width:1.5}
[dir="rtl"] .ic-flip{transform:scaleX(-1)}

/* ═══ shell ═══ */
.strip{background:var(--c-surface-2);color:var(--c-text-3);border-bottom:1px solid var(--c-border);
  font-size:var(--t-cap);padding:0 var(--s4);height:var(--h-notice);display:flex;align-items:center;gap:var(--s2)}
.strip b{font-weight:600;color:var(--c-text-2)}
.strip span{opacity:1;color:var(--c-text-3)}
.frame{grid-template-columns:var(--w-nav) minmax(0,1fr);height:calc(100vh - var(--h-notice))}
body.nav-mini .frame{grid-template-columns:var(--w-nav-mini) minmax(0,1fr)}

/* sidebar */
.nav{background:var(--c-surface);border-inline-end:1px solid var(--c-border)}
.nav.own{background:var(--c-surface)}
.logo{padding:var(--s3) var(--s4);gap:var(--sp-10);border-bottom:1px solid var(--c-border);min-height:var(--h-top)}
.logo .m{width:28px;height:28px;border-radius:var(--r-md);background:var(--c-accent);color:#fff;
  font-size:13px;font-weight:700;display:grid;place-items:center;letter-spacing:-.02em}
.logo .t{color:var(--c-text);font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.logo .s{color:var(--c-text-3);font-size:11px;font-weight:450}
body.nav-mini .logo .t,body.nav-mini .logo .s,body.nav-mini .navsearch,
body.nav-mini .gp .gl,body.nav-mini .gp .c,body.nav-mini .gp ul{display:none}
body.nav-mini .logo{justify-content:center;padding-inline:0}
.navsearch{padding:var(--s3) var(--s3) var(--s2);border-bottom:0}
.navsearch input{background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:var(--r-md);
  color:var(--c-text);font-size:var(--t-sec);padding:var(--sp-6) var(--sp-10);font-family:inherit;width:100%}
.navsearch input::placeholder{color:var(--c-text-4)}
.navsearch input:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 3px var(--c-accent-soft)}
.tree{padding:2px var(--s2) var(--s6)}
.gp>button{width:100%;display:flex;align-items:center;gap:var(--sp-10);background:none;border:0;
  padding:var(--sp-7) var(--sp-9);border-radius:var(--r-md);color:var(--c-text-2);font-size:var(--t-sec);
  font-weight:500;cursor:pointer;font-family:inherit;text-align:start;transition:background var(--dur) var(--ease)}
.gp>button:hover{background:var(--c-surface-3);color:var(--c-text)}
.gp>button .i{width:16px;height:16px;flex:none;opacity:.85;display:grid;place-items:center;color:var(--c-text-3)}
.gp>button:hover .i,.gp.open>button .i{color:var(--c-accent)}
.gp.open>button{color:var(--c-text);font-weight:600}
.gp>button .c{margin-inline-start:auto;width:14px;height:14px;color:var(--c-text-4);
  transition:transform var(--dur) var(--ease);font-size:0}
.gp.open>button .c{transform:rotate(90deg)}
[dir="rtl"] .gp>button .c{transform:scaleX(-1)}
[dir="rtl"] .gp.open>button .c{transform:scaleX(-1) rotate(90deg)}
.gp ul{margin:1px 0 var(--s2);padding:0;position:relative}
.gp ul::before{content:"";position:absolute;inset-block:2px;inset-inline-start:17px;
  width:1px;background:var(--c-border)}
.gp a{display:block;padding:var(--sp-6) var(--sp-10) var(--sp-6) 34px;color:var(--c-text-2);font-size:var(--t-sec);
  border-radius:var(--r-md);position:relative;font-weight:450;line-height:1.45;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
[dir="rtl"] .gp a{padding:var(--sp-6) 34px var(--sp-6) var(--sp-10)}
.gp a:hover{background:var(--c-surface-3);color:var(--c-text)}
.gp a.on{background:var(--c-accent-soft);color:var(--c-accent-ink);font-weight:600}
.gp a.on::before{content:"";position:absolute;inset-block:6px;inset-inline-start:15px;
  width:2px;border-radius:2px;background:var(--c-accent)}
.navfoot{border-top:1px solid var(--c-border);padding:var(--s2);display:flex;align-items:center;gap:var(--s2)}
.navfoot button{background:none;border:0;padding:var(--sp-6);border-radius:var(--r-md);color:var(--c-text-3);
  cursor:pointer;display:grid;place-items:center}
.navfoot button:hover{background:var(--c-surface-3);color:var(--c-text)}

/* top bar */
.main{background:var(--c-bg)}
.topbar{background:var(--c-surface);border-bottom:1px solid var(--c-border);height:var(--h-top);
  padding:0 var(--s3) 0 var(--s4);gap:var(--s3)}
[dir="rtl"] .topbar{padding:0 var(--s4) 0 var(--s3)}
.hamb{display:grid;place-items:center;background:none;border:0;padding:var(--sp-6);border-radius:var(--r-md);
  color:var(--c-text-3);cursor:pointer}
.hamb:hover{background:var(--c-surface-3);color:var(--c-text)}
.crumb{display:flex;align-items:center;gap:var(--sp-6);font-size:var(--t-sec);color:var(--c-text-3);min-width:0}
.crumb .cm{color:var(--c-text-3)} .crumb .cs{color:var(--c-text);font-weight:600}
.crumb svg{color:var(--c-text-4)}
.ctx{margin-inline-start:auto;gap:var(--s2)}
.kbtn{display:flex;align-items:center;gap:var(--s2);background:var(--c-surface-2);
  border:1px solid var(--c-border);border-radius:var(--r-md);padding:var(--sp-5) var(--sp-10);font-size:var(--t-sec);
  color:var(--c-text-3);cursor:pointer;font-family:inherit;min-width:210px;transition:all var(--dur) var(--ease)}
.kbtn:hover{border-color:var(--c-border-strong);background:var(--c-surface)}
.kbtn kbd{margin-inline-start:auto;font-family:var(--f-mono);font-size:10px;color:var(--c-text-4);
  background:var(--c-surface-3);border:1px solid var(--c-border);border-radius:var(--r-sm);padding:var(--sp-1) var(--sp-5)}
.tbtn{display:grid;place-items:center;background:none;border:0;width:30px;height:30px;
  border-radius:var(--r-md);color:var(--c-text-3);cursor:pointer;position:relative;transition:all var(--dur) var(--ease)}
.tbtn:hover{background:var(--c-surface-3);color:var(--c-text)}
.tbtn .dotn{position:absolute;top:5px;inset-inline-end:5px;width:6px;height:6px;border-radius:50%;
  background:var(--c-danger);border:1.5px solid var(--c-surface)}
.ctxchip{display:flex;align-items:center;gap:var(--sp-7);background:var(--c-surface-2);border:1px solid var(--c-border);
  border-radius:var(--r-md);padding:var(--s1) var(--sp-9);font-size:var(--t-sec);color:var(--c-text-2);cursor:pointer;
  font-family:inherit;max-width:300px;transition:all var(--dur) var(--ease)}
.ctxchip:hover{border-color:var(--c-border-strong);background:var(--c-surface)}
.ctxchip b{font-weight:600;color:var(--c-text)}
.ctxchip .sep{color:var(--c-border-strong)}
.synchip{display:flex;align-items:center;gap:var(--sp-6);border-radius:var(--r-md);padding:var(--s1) var(--sp-9);
  font-size:var(--t-cap);font-weight:500;cursor:pointer;border:1px solid transparent;font-family:inherit;
  transition:all var(--dur) var(--ease)}
.synchip.ok{background:var(--c-success-soft);color:var(--c-success);border-color:var(--c-success-border)}
.synchip.wa{background:var(--c-warning-soft);color:var(--c-warning);border-color:var(--c-warning-border)}
.synchip.ba{background:var(--c-danger-soft);color:var(--c-danger);border-color:var(--c-danger-border)}
.synchip:hover{filter:brightness(.97)}
.appsw{border:1px solid var(--c-border);border-radius:var(--r-md);background:var(--c-surface-2);padding:var(--sp-2);gap:var(--sp-2)}
.appsw button{background:none;border:0;padding:var(--s1) var(--sp-9);font-size:var(--t-cap);font-weight:500;
  color:var(--c-text-3);border-radius:var(--r-sm);display:flex;align-items:center;gap:var(--sp-5);cursor:pointer;font-family:inherit}
.appsw button:hover{color:var(--c-text)}
.appsw button.on{background:var(--c-surface);color:var(--c-text);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.appsw button.on.own{background:var(--c-surface);color:var(--c-owner-ink)}
.sw{border:1px solid var(--c-border);border-radius:var(--r-md);background:var(--c-surface-2);padding:var(--sp-2);gap:var(--sp-2);display:flex}
.sw button{background:none;border:0;padding:var(--sp-3) var(--s2);font-size:var(--t-cap);color:var(--c-text-3);
  border-radius:var(--r-sm);cursor:pointer;font-weight:500;font-family:inherit}
.sw button.on{background:var(--c-surface);color:var(--c-text);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.usr{gap:var(--s2)}
.usr .a{width:26px;height:26px;border-radius:var(--r-full);background:var(--c-accent-soft);
  color:var(--c-accent-ink);font-size:11px;font-weight:600;display:grid;place-items:center}
#logoutb{padding:4px 9px !important;font-size:var(--t-cap) !important}
.mini{background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:var(--r-md);
  padding:var(--s1) var(--s2);font-size:var(--t-sec);color:var(--c-text-2);font-family:inherit}

/* MDI tab strip */
.tabs{background:var(--c-surface-2);border-bottom:1px solid var(--c-border);height:var(--h-tabs);
  padding:0 var(--s3);gap:0;align-items:stretch}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;
  padding:0 var(--s3);font-size:var(--t-sec);color:var(--c-text-3);gap:var(--s2);top:0;
  transition:color var(--dur) var(--ease)}
.tab:hover{color:var(--c-text)}
.tab.on{background:transparent;color:var(--c-text);font-weight:600;border-bottom-color:var(--c-accent);top:0}
.tab .x{opacity:.45;border-radius:var(--r-sm);width:15px;height:15px;display:grid;place-items:center;font-size:13px}
.tab .x:hover{opacity:1;background:var(--c-surface-4)}

/* content area */
.scroll{padding:var(--s5) var(--s6) var(--s8)}

/* ═══ page header ═══ */
.head{align-items:flex-start;gap:var(--s4);margin-bottom:var(--s4);
  padding-bottom:var(--s4);border-bottom:1px solid var(--c-border)}
.head h1{font-size:var(--t-page);font-weight:650;letter-spacing:-.022em;line-height:1.2;color:var(--c-text)}
.head .sub{color:var(--c-text-3);font-size:var(--t-sec);margin-top:var(--sp-5);max-width:78ch;line-height:1.55}
.tools{gap:var(--s2);align-items:center}

/* ═══ buttons ═══ */
.b{background:var(--c-surface);border:1px solid var(--c-border-strong);border-radius:var(--r-md);
  padding:var(--sp-6) var(--sp-11);font-size:var(--t-sec);font-weight:500;color:var(--c-text-2);cursor:pointer;
  font-family:inherit;display:inline-flex;align-items:center;gap:var(--sp-6);line-height:1.4;
  transition:all var(--dur) var(--ease);white-space:nowrap}
.b:hover{background:var(--c-surface-2);border-color:var(--c-text-4);color:var(--c-text)}
.b:active{background:var(--c-surface-3)}
.b.p{background:var(--c-accent);border-color:var(--c-accent);color:#fff;font-weight:600}
.b.p:hover{background:var(--c-accent-hover);border-color:var(--c-accent-hover);color:#fff}
.b.d{background:var(--c-surface);border-color:var(--c-danger-border);color:var(--c-danger)}
.b.d:hover{background:var(--c-danger-soft);border-color:var(--c-danger);color:var(--c-danger)}
.b.g{border-color:transparent;background:transparent;color:var(--c-text-2)}
.b.g:hover{background:var(--c-surface-3);border-color:transparent}
.b.post{background:var(--c-accent);border-color:var(--c-accent);color:#fff;font-weight:600;
  padding:var(--sp-6) 15px;box-shadow:0 1px 2px rgba(15,23,42,.12)}
.b.post:hover{background:var(--c-accent-hover)}
.b[disabled],.b.off{opacity:.5;pointer-events:none}
.b .ic{opacity:.85}

/* ═══ surfaces / sections ═══ */
.pane{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);
  box-shadow:none;margin-bottom:var(--s3);overflow:hidden}
.pane>.ph{padding:10px var(--s4);border-bottom:1px solid var(--c-border);background:transparent;gap:var(--s3)}
.pane>.ph h2{font-size:var(--t-card);font-weight:600;text-transform:none;letter-spacing:-.005em;
  color:var(--c-text);display:flex;align-items:center;gap:var(--sp-7)}
.pane>.ph .r{gap:var(--s2)}
.pb{padding:var(--s4)}
.g{gap:var(--s3);margin-bottom:var(--s3)}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.sp{gap:var(--s3)}

/* ═══ KPI / metric ═══ */
.kpi{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);
  padding:var(--s3) var(--s4) 14px;box-shadow:none;position:relative}
.kpi .k{font-size:var(--t-cap);text-transform:none;letter-spacing:0;color:var(--c-text-3);font-weight:500;
  display:flex;align-items:center;gap:var(--sp-6)}
.kpi .v{font-size:24px;font-weight:650;margin-top:var(--sp-6);letter-spacing:-.025em;color:var(--c-text);line-height:1.15}
.kpi .d{font-size:var(--t-cap);margin-top:var(--sp-5);color:var(--c-text-3);display:flex;align-items:center;gap:var(--s1)}
.kpi .d.u{color:var(--c-success)} .kpi .d.w{color:var(--c-warning)}

/* ═══ data table ═══ */
.tw{border:0;border-radius:0;position:relative}
.tw table{width:100%;border-collapse:separate;border-spacing:0}
.tw th{position:sticky;top:0;z-index:2;background:var(--c-surface-2);
  font-size:var(--t-cap);font-weight:600;text-transform:none;letter-spacing:.01em;color:var(--c-text-3);
  padding:8px var(--s3);text-align:start;border-bottom:1px solid var(--c-border);white-space:nowrap}
.tw th.n{text-align:end}
.tw td{padding:8px var(--s3);border-bottom:1px solid var(--c-border-soft);font-size:var(--t-sec);
  color:var(--c-text);vertical-align:middle;line-height:1.45}
.tw td.n{text-align:end;font-variant-numeric:tabular-nums}
.tw tbody tr{transition:background 90ms linear}
.tw tbody tr:hover{background:var(--c-surface-2)}
.tw tbody tr:last-child td{border-bottom:0}
.tw tbody tr.sel{background:var(--c-accent-soft)}
body.dense .tw td{padding:5px var(--s3)}
body.dense .tw th{padding:6px var(--s3)}
.tw td b,.tw td strong{font-weight:600}
.rowact{opacity:0;cursor:pointer;padding:var(--sp-3);border-radius:var(--r-sm);color:var(--c-text-4);
  display:inline-grid;place-items:center;transition:all var(--dur) var(--ease)}
tr:hover .rowact{opacity:.7}
.rowact:hover{opacity:1 !important;background:var(--c-danger-soft);color:var(--c-danger)}
.tblbar{display:flex;align-items:center;gap:var(--s2);padding:8px var(--s4);
  border-bottom:1px solid var(--c-border);background:var(--c-surface);flex-wrap:wrap}
.tblbar .rc{margin-inline-start:auto;font-size:var(--t-cap);color:var(--c-text-3)}
.scrollhint{position:absolute;inset-inline-end:0;inset-block:0;width:36px;pointer-events:none;
  background:linear-gradient(to var(--fade-dir,left),var(--c-surface),transparent)}

/* ═══ status badge ═══ */
.pill{display:inline-flex;align-items:center;gap:var(--s1);font-size:var(--t-cap);padding:var(--sp-2) var(--sp-7);
  border-radius:var(--r-sm);font-weight:500;border:1px solid transparent;line-height:1.5;
  white-space:nowrap;vertical-align:baseline}
.pill .ic{width:12px;height:12px;stroke-width:2;vertical-align:-2px}
.pill.ok{background:var(--c-success-soft);color:var(--c-success);border-color:var(--c-success-border)}
.pill.wa{background:var(--c-warning-soft);color:var(--c-warning);border-color:var(--c-warning-border)}
.pill.ba{background:var(--c-danger-soft);color:var(--c-danger);border-color:var(--c-danger-border)}
.pill.in{background:var(--c-info-soft);color:var(--c-info);border-color:var(--c-info-border)}
.pill.mu{background:var(--c-neutral-soft);color:var(--c-text-3);border-color:var(--c-border)}
.pill.solid{background:var(--c-accent);color:#fff;border-color:var(--c-accent);font-weight:600}

/* ═══ forms ═══ */
.fs{gap:14px var(--s4)}
.f2{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.f3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.f4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.f5{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.fs>div>label,label{display:block;font-size:var(--t-cap);font-weight:500;color:var(--c-text-2);
  margin-bottom:var(--sp-5);text-transform:none;letter-spacing:0}
.in{background:var(--c-surface);border:1px solid var(--c-border-strong);border-radius:var(--r-md);
  padding:var(--sp-6) var(--sp-10);font-size:var(--t-sec);color:var(--c-text);font-family:inherit;height:32px;
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);width:100%}
textarea.in{height:auto;padding:var(--s2) var(--sp-10);line-height:1.55;resize:vertical}
select.in{cursor:pointer;padding-inline-end:26px}
.in::placeholder{color:var(--c-text-4)}
.in:hover:not([readonly]):not(:disabled){border-color:var(--c-text-4)}
.in:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 3px var(--c-accent-soft)}
.in[readonly],.in:disabled{background:var(--c-surface-3);color:var(--c-text-2);border-color:var(--c-border);cursor:default}
.in.n{text-align:end}
.hint{font-size:var(--t-cap);color:var(--c-text-3);margin-top:var(--sp-5);line-height:1.5}
.req{color:var(--c-danger);font-weight:600}
.chk{gap:var(--s2);align-items:center;font-size:var(--t-sec);margin-top:22px;color:var(--c-text-2)}
.chk input[type=checkbox]{width:15px;height:15px;accent-color:var(--c-accent);cursor:pointer;flex:none}
.sect{margin-bottom:var(--s5)}
.sect h4{font-size:var(--t-cap);text-transform:uppercase;letter-spacing:.06em;color:var(--c-text-3);
  font-weight:600;margin:0 0 var(--s3);padding-bottom:var(--sp-7);border-bottom:1px solid var(--c-border)}

/* record navigator */
.navnum button{background:var(--c-surface);border:1px solid var(--c-border-strong);padding:0;
  width:28px;height:32px;display:grid;place-items:center;color:var(--c-text-3);cursor:pointer}
.navnum button:hover{background:var(--c-surface-2);color:var(--c-text)}
.navnum .in{border-radius:0;text-align:center;max-width:86px;border-inline:0}

/* ═══ tabs (in-page) ═══ */
.tabsx{gap:var(--s1);border-bottom:1px solid var(--c-border);margin-bottom:var(--s4);padding-bottom:0}
.tabsx button{border-bottom:2px solid transparent;padding:var(--s2) var(--s3);color:var(--c-text-3);
  font-size:var(--t-sec);font-weight:500;margin-bottom:-1px;font-family:inherit;
  transition:color var(--dur) var(--ease)}
.tabsx button:hover{color:var(--c-text)}
.tabsx button.on{color:var(--c-accent-ink);border-bottom-color:var(--c-accent);font-weight:600}

/* ═══ alert / note ═══ */
.note{background:var(--c-surface);border:1px solid var(--c-border);border-inline-start:3px solid var(--c-accent);
  border-radius:var(--r-md);padding:var(--sp-11) var(--sp-14);font-size:var(--t-sec);color:var(--c-text-2);
  margin-bottom:var(--s3);line-height:1.6}
.note b{font-weight:600;color:var(--c-text)}
.scopebar{border-radius:var(--r-md);padding:var(--s2) var(--sp-13);font-size:var(--t-cap);margin-bottom:var(--s4);gap:var(--s2)}
.scopebar.own{background:var(--c-owner-soft);border-color:var(--c-owner);color:var(--c-owner-ink)}
.scopebar.ten{background:var(--c-accent-soft);border-color:var(--c-accent);color:var(--c-accent-ink)}

/* ═══ modal ═══ */
.ov{background:rgba(15,23,42,.45);backdrop-filter:blur(2px)}
.mod{border-radius:var(--r-xl);box-shadow:var(--e-dialog);border:1px solid var(--c-border);
  animation:modIn 180ms var(--ease)}
@keyframes modIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.mh{padding:var(--s4) var(--s5);border-bottom:1px solid var(--c-border)}
.mh h3{font-size:var(--t-section);font-weight:600;letter-spacing:-.01em}
.mh .x{width:28px;height:28px;border-radius:var(--r-md);display:grid;place-items:center;
  color:var(--c-text-3);font-size:0}
.mh .x:hover{background:var(--c-surface-3);color:var(--c-text)}
.mb{padding:var(--s5)}
.mf{padding:var(--s3) var(--s5);border-top:1px solid var(--c-border);background:var(--c-surface-2);gap:var(--s2)}

/* ═══ status bar ═══ */
.status{background:var(--c-surface);border-top:1px solid var(--c-border);padding:6px var(--s5);
  font-size:var(--t-cap);color:var(--c-text-3);gap:var(--s5)}
.status b{color:var(--c-text-2);font-weight:500}

/* ═══ legacy one-offs, brought into the system ═══ */
.chips{gap:var(--s2)} .chip{background:var(--c-surface-2);border:1px solid var(--c-border);
  border-radius:var(--r-md);padding:var(--s1) var(--sp-9);font-size:var(--t-cap);color:var(--c-text-2)}
.tot{gap:var(--sp-7);font-size:var(--t-sec)}
.tot .l{display:flex;justify-content:space-between;gap:var(--s4);color:var(--c-text-2)}
.tot .l b{font-variant-numeric:tabular-nums;font-weight:500;color:var(--c-text)}
.tot .g{border-top:1px solid var(--c-border);padding-top:var(--sp-9);margin-top:var(--sp-3);font-size:var(--t-section);
  font-weight:650;color:var(--c-text)}
.tot .g b{font-weight:650}
.bars{gap:var(--sp-6);height:110px}
.bars i{background:var(--c-accent);opacity:.55;border-radius:3px 3px 0 0;transition:opacity var(--dur) var(--ease)}
.bars i:hover{opacity:.85} .bars i:last-child{background:var(--c-accent);opacity:1}
.bars i s{bottom:-18px;font-size:var(--t-micro);color:var(--c-text-4)}
.flow{gap:var(--s2);font-size:var(--t-cap)}
.flow .s{background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:var(--r-md);
  padding:var(--sp-6) var(--sp-10);font-weight:500;color:var(--c-text-2)}
.flow .s.on{background:var(--c-accent-soft);border-color:var(--c-accent);color:var(--c-accent-ink);font-weight:600}
.flow .ar{color:var(--c-text-4)}
.lgd{gap:var(--s4);font-size:var(--t-cap);color:var(--c-text-3);margin-top:var(--sp-9)}
.mini2{font-size:var(--t-cap);color:var(--c-text-3)}
.empty{padding:var(--s8) var(--s4);text-align:center;color:var(--c-text-3);font-size:var(--t-sec)}
.keys{gap:var(--sp-7)}
.keys button{padding:var(--sp-10) var(--sp-6);border-radius:var(--r-md);border:1px solid var(--c-border-strong);
  background:var(--c-surface);font-size:var(--t-sec);font-weight:500;color:var(--c-text-2);
  font-family:inherit;transition:all var(--dur) var(--ease)}
.keys button:hover{background:var(--c-surface-2);border-color:var(--c-text-4);color:var(--c-text)}
.keys button.p{background:var(--c-accent);border-color:var(--c-accent);color:#fff;font-weight:600}
.matrix .chk{margin-top:0}

/* account tree */
.treepane{background:var(--c-surface)}
.treetools{padding:var(--s3);border-bottom:1px solid var(--c-border);gap:var(--s2)}
.treetools .row .b{padding:var(--sp-5) var(--s2);font-size:var(--t-cap);justify-content:center}
.trw{font-size:var(--t-sec)}
.trw .nd{padding:var(--sp-5) var(--s2);border-radius:var(--r-md);gap:var(--sp-6);color:var(--c-text-2);align-items:center}
.trw .nd:hover{background:var(--c-surface-2);color:var(--c-text)}
.trw .nd.on{background:var(--c-accent-soft);color:var(--c-accent-ink);font-weight:600}
.trw .cd{color:var(--c-text-3);min-width:44px;font-size:11px}
.trw .nd.on .cd{color:var(--c-accent-ink)}
.trw .bal{font-variant-numeric:tabular-nums;font-family:var(--f-ui);font-size:11.5px}
.trw .tw2{color:var(--c-text-4)}
.trw .nd.d1{font-weight:650;color:var(--c-text);margin-top:var(--sp-7)}
.trw .nd.d2{font-weight:550}
.trw .nd.d2,.trw .nd.d3,.trw .nd.d4,.trw .nd.d5{border-inline-start:1px solid var(--c-border)}

/* POS */
.rail{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);padding:var(--s2);gap:var(--sp-3)}
.rail button{background:transparent;border:1px solid transparent;border-radius:var(--r-md);padding:var(--sp-9) var(--s2);
  font-size:var(--t-cap);font-weight:500;color:var(--c-text-2);text-align:start;font-family:inherit;
  transition:all var(--dur) var(--ease)}
.rail button:hover{background:var(--c-surface-2);color:var(--c-text)}
.rail button.on{background:var(--c-accent);border-color:var(--c-accent);color:#fff;font-weight:600}
.tiles{gap:var(--sp-9);grid-template-columns:repeat(auto-fill,minmax(142px,1fr))}
.tile{border-radius:var(--r-lg);border:1px solid var(--c-border);box-shadow:none;padding:var(--sp-11);min-height:96px;
  transition:border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.tile:hover{border-color:var(--c-accent);transform:none;background:var(--c-surface-2)}
.tile .nm{font-size:var(--t-sec);font-weight:550;color:var(--c-text)}
.tile .pr{font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-size:15px;font-weight:650;color:var(--c-text)}
.tile .qt{font-size:var(--t-micro);color:var(--c-text-3)}
.hero{background:var(--c-text);color:var(--c-surface);border-radius:var(--r-lg);padding:14px var(--s4)}
:root[data-theme="dark"] .hero,@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:var(--c-surface-4)}}
.hero .a{font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-size:30px;font-weight:650;letter-spacing:-.03em}
.hero .b2{font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-size:16px;color:#9FD9C9;font-weight:500}
.hero .l{font-size:var(--t-cap);text-transform:none;letter-spacing:0;color:rgba(255,255,255,.62);font-weight:450}
.tblx button{border-radius:var(--r-lg);border:1px solid var(--c-border);background:var(--c-surface);
  padding:15px var(--s2);font-size:var(--t-sec);font-weight:600;color:var(--c-text);font-family:inherit}
.tblx button:hover{border-color:var(--c-border-strong);background:var(--c-surface-2)}
.tblx button .s{font-size:var(--t-micro);font-weight:450;color:var(--c-text-3)}
.tblx button.busy{border-color:var(--c-warning-border);background:var(--c-warning-soft);color:var(--c-warning)}
.tblx button.pay{border-color:var(--c-success-border);background:var(--c-success-soft);color:var(--c-success)}

/* ═══ Phase 3 new components ═══ */
.ds-toolbar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.ds-fchip{display:inline-flex;align-items:center;gap:var(--sp-5);background:var(--c-accent-soft);
  border:1px solid var(--c-accent);color:var(--c-accent-ink);border-radius:var(--r-md);
  padding:var(--sp-3) var(--sp-6) var(--sp-3) var(--sp-9);font-size:var(--t-cap);font-weight:500}
.ds-fchip b{font-weight:600}
.ds-fchip button{background:none;border:0;color:inherit;cursor:pointer;opacity:.6;padding:var(--sp-2);
  border-radius:var(--r-sm);display:grid;place-items:center}
.ds-fchip button:hover{opacity:1;background:rgba(0,0,0,.06)}
.ds-empty{padding:44px var(--s5);text-align:center}
.ds-empty .ei{width:40px;height:40px;border-radius:var(--r-lg);background:var(--c-surface-3);
  display:grid;place-items:center;margin:0 auto var(--s3);color:var(--c-text-4)}
.ds-empty h4{margin:0 0 var(--sp-5);font-size:var(--t-section);font-weight:600;color:var(--c-text)}
.ds-empty p{margin:0 auto var(--s4);font-size:var(--t-sec);color:var(--c-text-3);max-width:44ch;line-height:1.6}
.ds-sk{background:linear-gradient(90deg,var(--c-surface-3) 25%,var(--c-surface-4) 37%,var(--c-surface-3) 63%);
  background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:var(--r-sm);height:11px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.ds-drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(520px,92vw);background:var(--c-surface);
  border-inline-start:1px solid var(--c-border);box-shadow:var(--e-drawer);z-index:300;
  display:none;flex-direction:column;animation:drIn 200ms var(--ease)}
.ds-drawer.on{display:flex}
@keyframes drIn{from{transform:translateX(var(--dr-from,24px));opacity:.4}to{transform:none;opacity:1}}
[dir="rtl"] .ds-drawer{--dr-from:-24px}
.ds-drawer .dh{padding:var(--s4) var(--s5);border-bottom:1px solid var(--c-border);display:flex;
  align-items:flex-start;gap:var(--s3)}
.ds-drawer .dh h3{margin:0;font-size:var(--t-section);font-weight:600}
.ds-drawer .dh p{margin:var(--sp-3) 0 0;font-size:var(--t-cap);color:var(--c-text-3)}
.ds-drawer .db{padding:var(--s5);overflow-y:auto;flex:1}
.ds-scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:299;display:none}
.ds-scrim.on{display:block}
.ds-toasts{position:fixed;inset-block-end:var(--s5);inset-inline-end:var(--s5);z-index:400;
  display:flex;flex-direction:column;gap:var(--s2);pointer-events:none}
.ds-toast{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);
  box-shadow:var(--e-pop);padding:var(--sp-11) var(--sp-14);font-size:var(--t-sec);display:flex;align-items:flex-start;
  gap:var(--s2);min-width:280px;max-width:380px;pointer-events:auto;animation:tIn 200ms var(--ease)}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ds-toast .ti{flex:none;margin-top:var(--sp-1)}
.ds-toast.ok .ti{color:var(--c-success)} .ds-toast.ba .ti{color:var(--c-danger)}
.ds-toast.wa .ti{color:var(--c-warning)} .ds-toast.in .ti{color:var(--c-info)}
.ds-toast b{font-weight:600;display:block;color:var(--c-text)}
.ds-toast span{color:var(--c-text-3);font-size:var(--t-cap)}
.ds-pop{position:absolute;top:calc(100% + 6px);inset-inline-end:0;background:var(--c-surface);
  border:1px solid var(--c-border);border-radius:var(--r-lg);box-shadow:var(--e-pop);
  min-width:300px;z-index:250;display:none;overflow:hidden}
.ds-pop.on{display:block;animation:tIn 140ms var(--ease)}
.ds-pop .ph2{padding:var(--sp-11) var(--sp-14);border-bottom:1px solid var(--c-border);font-size:var(--t-card);font-weight:600;
  display:flex;align-items:center;gap:var(--sp-7)}
.ds-pop .pb2{padding:var(--s3) var(--sp-14)}
.ds-pop .row{display:flex;justify-content:space-between;gap:var(--s3);font-size:var(--t-sec);padding:var(--sp-5) 0;
  color:var(--c-text-2)}
.ds-pop .row b{font-weight:550;color:var(--c-text)}
.ds-pop .pf{padding:var(--sp-10) var(--sp-14);border-top:1px solid var(--c-border);background:var(--c-surface-2);
  display:flex;gap:var(--s2)}
.ds-cmd{position:fixed;inset:0;z-index:500;display:none;padding-top:12vh;justify-content:center;
  background:rgba(15,23,42,.45);backdrop-filter:blur(3px)}
.ds-cmd.on{display:flex}
.ds-cmd .box{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-xl);
  box-shadow:var(--e-dialog);width:min(620px,92vw);height:fit-content;max-height:70vh;
  display:flex;flex-direction:column;overflow:hidden;animation:modIn 180ms var(--ease)}
.ds-cmd .ci{display:flex;align-items:center;gap:var(--s3);padding:14px var(--s4);border-bottom:1px solid var(--c-border)}
.ds-cmd .ci input{border:0;outline:0;background:none;font-size:var(--t-section);color:var(--c-text);
  font-family:inherit;width:100%}
.ds-cmd .cl{overflow-y:auto;padding:var(--s2)}
.ds-cmd .cg{font-size:var(--t-micro);text-transform:uppercase;letter-spacing:.07em;color:var(--c-text-4);
  font-weight:600;padding:var(--sp-9) var(--sp-10) var(--sp-5)}
.ds-cmd .ci2{display:flex;align-items:center;gap:var(--sp-10);padding:var(--s2) var(--sp-10);border-radius:var(--r-md);
  font-size:var(--t-sec);color:var(--c-text-2);cursor:pointer}
.ds-cmd .ci2:hover,.ds-cmd .ci2.on{background:var(--c-accent-soft);color:var(--c-accent-ink)}
.ds-cmd .ci2 .k2{margin-inline-start:auto;font-size:var(--t-micro);color:var(--c-text-4)}
.ds-cmd .cf{padding:var(--s2) var(--sp-14);border-top:1px solid var(--c-border);background:var(--c-surface-2);
  font-size:var(--t-micro);color:var(--c-text-4);display:flex;gap:var(--s4)}
.ds-attn{display:flex;align-items:flex-start;gap:var(--sp-11);padding:11px var(--s4);border-bottom:1px solid var(--c-border-soft);
  cursor:pointer;transition:background var(--dur) var(--ease)}
.ds-attn:last-child{border-bottom:0}
.ds-attn:hover{background:var(--c-surface-2)}
.ds-attn .ai{width:26px;height:26px;border-radius:var(--r-md);display:grid;place-items:center;flex:none;margin-top:var(--sp-1)}
.ds-attn .ai.ba{background:var(--c-danger-soft);color:var(--c-danger)}
.ds-attn .ai.wa{background:var(--c-warning-soft);color:var(--c-warning)}
.ds-attn .ai.in{background:var(--c-info-soft);color:var(--c-info)}
.ds-attn .ai.ok{background:var(--c-success-soft);color:var(--c-success)}
.ds-attn .at{font-size:var(--t-sec);color:var(--c-text);font-weight:500}
.ds-attn .as{font-size:var(--t-cap);color:var(--c-text-3);margin-top:var(--sp-2)}
.ds-attn .av{margin-inline-start:auto;font-size:var(--t-sec);font-variant-numeric:tabular-nums;
  color:var(--c-text-2);font-weight:550;white-space:nowrap;display:flex;align-items:center;gap:var(--sp-6)}
.ds-attn:hover .av{color:var(--c-accent-ink)}
.ds-link{cursor:pointer;border-bottom:1px solid transparent;transition:border-color var(--dur) var(--ease)}
.ds-link:hover{border-bottom-color:currentColor}
.ds-drill{cursor:pointer;display:inline-flex;align-items:center;gap:var(--sp-3)}
.ds-drill .ic{opacity:0;transition:opacity var(--dur) var(--ease);width:12px;height:12px}
.ds-drill:hover{color:var(--c-accent-ink)} .ds-drill:hover .ic{opacity:.8}
tr:hover .ds-drill .ic{opacity:.4}
.ds-meter{height:5px;border-radius:99px;background:var(--c-surface-4);overflow:hidden;min-width:70px}
.ds-meter i{display:block;height:100%;background:var(--c-accent);border-radius:99px}
.ds-meter i.wa{background:var(--c-warning)} .ds-meter i.ba{background:var(--c-danger)}
.ds-ent{display:flex;align-items:flex-start;gap:var(--s4);flex-wrap:wrap;padding-bottom:var(--s4);
  border-bottom:1px solid var(--c-border);margin-bottom:var(--s4)}
.ds-ent .eav{width:44px;height:44px;border-radius:var(--r-lg);background:var(--c-accent-soft);
  color:var(--c-accent-ink);display:grid;place-items:center;flex:none}
.ds-ent h1{font-size:20px;font-weight:650;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:var(--sp-10)}
.ds-ent .esub{font-size:var(--t-sec);color:var(--c-text-3);margin-top:var(--s1);display:flex;gap:var(--s3);flex-wrap:wrap}
.ds-ent .esub span{display:flex;align-items:center;gap:var(--sp-5)}

 else if(f.t==='area') ctl=`<textarea class="in" rows="3" aria-label="${lab}">${esc(f.v||'')}</textarea>`;

/* ═══ enhance(): upgrades markup emitted by const-declared legacy helpers ═══ */
const BTNICON=[[/^print/i,'printer'],[/excel|export/i,'download'],[/import/i,'upload'],[/^pdf|^word/i,'file'],
 [/^\+|^new |add /i,'plus'],[/save/i,'check'],[/^post/i,'checkCircle'],[/sync/i,'refresh'],[/search|find/i,'search'],
 [/filter/i,'filter'],[/^open|view/i,'external'],[/delete|remove/i,'trash'],[/back/i,'chevR'],
 [/reverse|revalu|recalc|run /i,'refresh'],[/assist|support/i,'lifebuoy'],[/^send|email|whatsapp/i,'arrowR']];
function enhance(root){
 if(!root) return;
 // status badges: icon + label, never colour alone
 root.querySelectorAll('.pill').forEach(p=>{
  if(p.dataset.en) return; p.dataset.en='1';
  const t=p.textContent.trim(); if(!t||t==='—') return;
  p.insertAdjacentHTML('afterbegin',ic(statusIcon(t),'ic-14'));
 });
 // row action → icon button
 root.querySelectorAll('.rowact').forEach(a=>{
  if(a.dataset.en) return; a.dataset.en='1';
  a.innerHTML=ic('trash','ic-14'); a.setAttribute('role','button'); a.setAttribute('aria-label','Delete');
 });
 // buttons get a leading icon where it aids recognition
 root.querySelectorAll('button.b').forEach(b=>{
  if(b.dataset.en||b.querySelector('svg')) return; b.dataset.en='1';
  const t=b.textContent.trim();
  for(const [re,name] of BTNICON){ if(re.test(t)){ b.insertAdjacentHTML('afterbegin',ic(name,'ic-14')); break; } }
 });
 // horizontal scroll affordance on wide tables
 root.querySelectorAll('.tw[data-scroll]').forEach(w=>{
  const mark=()=>{ const over=w.scrollWidth-w.clientWidth>4;
   w.classList.toggle('has-scroll',over);
   if(over&&!w.querySelector('.scrollhint')){
     const h=document.createElement('div');h.className='scrollhint';
     h.style.setProperty('--fade-dir',document.documentElement.dir==='rtl'?'right':'left');
     w.appendChild(h);} };
  mark(); w.onscroll=()=>{const end=Math.abs(w.scrollWidth-w.clientWidth-Math.abs(w.scrollLeft))<4;
   const h=w.querySelector('.scrollhint'); if(h)h.style.opacity=end?'0':'1';};
 });
 // caret glyphs in the account tree → icons
 root.querySelectorAll('.trw .tw2').forEach(s=>{
  if(s.dataset.en) return; s.dataset.en='1';
  const t=s.textContent.trim();
  s.innerHTML = t==='▼'?ic('chevD','ic-14'):t==='▶'?ic('chevR','ic-14 ic-flip'):'<span style="opacity:.35">·</span>';
 });
 // record navigator glyphs
 root.querySelectorAll('.navnum button').forEach(b=>{
  if(b.dataset.en) return; b.dataset.en='1';
  const t=b.textContent.trim();
  const m={'|◀':'chevR','◀':'chevR','▶':'chevR','▶|':'chevR'};
  if(m[t]){ b.innerHTML=ic('chevR','ic-14 ic-flip'); if(t==='|◀'||t==='◀') b.firstChild.style.transform='scaleX(-1)'; }
 });
}

<script>
/* ── fld() gains the full state set ─────────────────────────────────────────

function fld(f){
 if(f.t==='note') return `<div class="fnote ${f.k||''}">${f.v||''}</div>`;
 if(f.t==='summary') return `<div class="fsum">${ic('alertC','ic-14')}<div><b>${esc(f.l||'This form is not ready to save')}</b>
   <ul>${(f.o||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`;
 const req=f.req?' <span class="req" title="Required">*</span>':'';
 const lab=esc(tx(f.l));
 const state=f.err?'is-err':f.warn?'is-warn':f.ok?'is-ok':'';
 const dis=f.dis?' disabled':'', busy=f.busy?' is-busy':'';
 const cls=`in${f.t==='num'?' n':''} ${state}${busy}`.trim();
 const msg = f.err  ? `<div class="fmsg err">${ic('alertC','ic-14')}<span>${esc(f.err)}</span></div>`
           : f.warn ? `<div class="fmsg warn">${ic('alertT','ic-14')}<span>${esc(f.warn)}</span></div>`
           : f.ok   ? `<div class="fmsg ok">${ic('checkCircle','ic-14')}<span>${esc(f.ok)}</span></div>`
           : f.hint ? `<div class="fmsg hintmsg">${f.hint}</div>` : '';
 if(f.t==='chk')
  return `<div class="chk ${f.err?'is-err':''}"><input type="checkbox" id="c${Math.random().toString(36).slice(2,8)}"
    ${f.v?'checked':''}${dis}><span>${lab}</span></div>${msg?`<div style="margin-top:-6px">${msg}</div>`:''}`;
 let ctl;
 if(f.t==='sel') ctl=`<select class="${cls}" aria-label="${lab}"${dis}${f.err?' aria-invalid="true"':''}>${(f.o||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
 else if(f.t==='area') ctl=`<textarea class="${cls}" rows="3" aria-label="${lab}"${dis}${f.err?' aria-invalid="true"':''}>${esc(f.v||'')}</textarea>`;
 else ctl=`<input class="${cls}" value="${esc(f.v||'')}" placeholder="${esc(f.ph||'')}" aria-label="${lab}"
    ${f.ro?'readonly':''}${dis}${f.err?' aria-invalid="true"':''}>`;
 return `<div class="fw ${state}${f.dis?' is-dis':''}"><label>${lab}${req}</label>${ctl}${msg}</div>`;

function checkModal(){

 body.querySelectorAll('.is-err').forEach(n=>n.classList.remove('is-err'));
 const bad=[];
 body.querySelectorAll('.fw').forEach(fw=>{

 });
 if(bad.length){

     <ul>${bad.slice(0,6).map(n=>`<li>${esc(n)}</li>`).join('')}${bad.length>6?`<li>and ${bad.length-6} more</li>`:''}</ul></div></div>`);

<script>
/* ═══ PRIORITY 2b — the validation rules the brief lists, running for real ═══
   All of these are format / arithmetic checks evaluated in the browser on
   what is typed. There is no server behind them and none is implied. Only
   rules already defined by the product are used: the debit/credit rules come
   from the accounting spec (a line is debit XOR credit; neither may be zero).
   No business rule has been invented for the demo.                          */
const VRULES=[
 {id:'email', test:l=>/e-?mail/i.test(l),
  run:v=>v && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? 'That is not a valid email address.' : ''},
 {id:'number', test:(l,f)=>f.t==='num',
  run:v=>v && isNaN(Number(String(v).replace(/[, ]/g,''))) ? 'Enter a number.' : ''},
 {id:'negative', test:(l,f)=>f.t==='num' && /qty|quantity|price|cost|limit|salary|amount|allowance|days|rate|stock|minimum|reorder/i.test(l),
  run:(v,l)=>Number(String(v).replace(/[, ]/g,''))<0 ? l.replace(/\s*\*/,'')+' cannot be negative.' : ''},
 {id:'percent', test:l=>/%|percent/i.test(l),
  run:v=>{const n=Number(String(v).replace(/[%, ]/g,'')); return v&&(isNaN(n)||n<0||n>100)?'Enter a percentage between 0 and 100.':'';}},
 {id:'date', test:l=>/date|expiry|arrival|from|until|to$/i.test(l),
  run:v=>v && !/^\d{2}\/\d{2}\/\d{4}$/.test(v) && !/^\d{2}\s\w{3}\s\d{4}$/.test(v) && /\d/.test(v)
        ? 'Use the format dd/mm/yyyy.' : ''}
];
const dparse=v=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec((v||'').trim());
 return m?new Date(+m[3],+m[2]-1,+m[1]).getTime():null;};

function fieldOf(el){ return el.closest('.fw'); }
function setMsg(fw,kind,text){
 if(!fw) return;
 fw.querySelectorAll('.fmsg.autogen').forEach(n=>n.remove());
 const ctl=fw.querySelector('.in'); if(!ctl) return;
 ctl.classList.remove('is-err','is-warn','is-ok'); fw.classList.remove('is-err');
 if(!text) return;
 ctl.classList.add(kind==='err'?'is-err':kind==='warn'?'is-warn':'is-ok');
 if(kind==='err') fw.classList.add('is-err');
 const icn=kind==='err'?'alertC':kind==='warn'?'alertT':'checkCircle';
 ctl.insertAdjacentHTML('afterend',
  `<div class="fmsg ${kind} autogen">${ic(icn,'ic-14')}<span>${esc(text)}</span></div>`);
}
function validateField(ctl){
 const fw=fieldOf(ctl); if(!fw) return '';
 const lab=(fw.querySelector('label')||{}).textContent||'';
 const spec={t:ctl.classList.contains('n')?'num':'text'};
 const v=(ctl.value||'').trim();
 for(const r of VRULES){ if(r.test(lab,spec)){ const m=r.run(v,lab); if(m){ setMsg(fw,'err',m); return m; } } }
 setMsg(fw,'',''); return '';
}
/* cross-field rules: date order, password match, debit XOR credit */
function validatePairs(body){
 const out=[];
 const byLabel={};
 body.querySelectorAll('.fw').forEach(fw=>{
  const l=((fw.querySelector('label')||{}).textContent||'').replace('*','').trim().toLowerCase();
  const c=fw.querySelector('.in'); if(c) byLabel[l]={fw:fw,ctl:c,v:(c.value||'').trim()};
 });
 const pairs=[['valid from','valid until'],['start date','end date'],['starts','expires'],
              ['date from','date to'],['from','to'],['period from','period to']];
 for(const [a,z] of pairs){
  if(byLabel[a]&&byLabel[z]){
   const d1=dparse(byLabel[a].v), d2=dparse(byLabel[z].v);
   if(d1&&d2&&d2<d1){ setMsg(byLabel[z].fw,'err','This date is before “'+a+'”.'); out.push(z); }
  }
 }
 const p=byLabel['password'], cp=byLabel['confirm password'];
 if(p&&cp&&p.v&&cp.v&&p.v!==cp.v){ setMsg(cp.fw,'err','The two passwords do not match.'); out.push('confirm password'); }
 const dr=byLabel['debit'], cr=byLabel['credit'];
 if(dr&&cr){
  const dv=Number(String(dr.v).replace(/[, ]/g,''))||0, cv=Number(String(cr.v).replace(/[, ]/g,''))||0;
  if(dv&&cv){ setMsg(cr.fw,'err','A line is either a debit or a credit, never both.'); out.push('credit'); }
  else if(!dv&&!cv){ setMsg(dr.fw,'err','Enter an amount in debit or in credit.'); out.push('debit'); }
 }
 return out;
}
/* fold the rules into the save-time check */
checkModal=(orig=>function(){
 const body=$('#mBody'); if(!body) return orig();
 let bad=0;
 body.querySelectorAll('.in').forEach(c=>{ if(!c.disabled&&!c.readOnly&&validateField(c)) bad++; });
 bad+=validatePairs(body).length;
 const requiredOk=orig();
 if(bad){ body.scrollTop=0; const f=body.querySelector('.is-err'); if(f&&f.focus) f.focus(); return false; }
 return requiredOk;
})(checkModal);

/* live feedback as the user leaves a field, and cross-field on change */
document.addEventListener('blur',e=>{
 const c=e.target; if(!c.classList||!c.classList.contains('in')) return;
 if(!c.closest('#mBody')) return;
 validateField(c); validatePairs($('#mBody'));
},true);
paint();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   PRIORITY 5 — ONE SEMANTIC STATUS DICTIONARY
   pill() is a const and cannot be reassigned, so the dictionary is applied in
   the enhance() pass: every rendered pill has its tone corrected to the one
   meaning that status carries everywhere in the product. Labels not in the
   dictionary are left exactly as the screen wrote them.
   tone: ok = settled/good · in = in flight, neutral · wa = needs a person
         ba = blocked/failed · mu = inactive/not applicable
   ═══════════════════════════════════════════════════════════════════════ */
const STATUSDICT={
 /* ── document lifecycle ── */
 'draft':          ['in','file',       'Written but not yet in the ledger'],
 'posted':         ['ok','checkCircle','In the ledger and immutable'],
 'reversed':       ['mu','refresh',    'Undone by a later entry, both kept'],
 'cancelled':      ['mu','x',          'Abandoned before it was posted'],
 'locked':         ['mu','lock',       'Closed period — cannot be changed'],
 'open':           ['in','file',       'Still in progress, nobody is late'],
 'closed':         ['mu','lock',       'Finished'],
 'pending':        ['in','history',    'Waiting on a step, not on a person'],
 'waiting':        ['wa','alertT',     'Waiting on a person'],
 'in progress':    ['in','history',    'Being worked on now'],
 'in transit':     ['in','package',    'On its way, nothing is wrong'],
 'on order':       ['in','clipboard',  'Ordered, not yet received'],
 'partially received':['wa','alertT',  'Some of it has arrived'],
 /* ── approval / money ── */
 'approved':       ['ok','checkCircle',''],
 'rejected':       ['ba','alertC',     ''],
 'paid':           ['ok','checkCircle',''],
 'unpaid':         ['wa','alertT',     ''],
 'overdue':        ['ba','alertC',     ''],
 'partly paid':    ['wa','alertT',     ''],
 /* ── sync / device ── */
 'syncing':        ['in','refresh',    'Sending now'],
 'synced':         ['ok','cloud',      'Everything is up to date'],
 'offline':        ['wa','cloudOff',   'Working, but not connected'],
 'conflict':       ['ba','alertC',     'Needs a person to choose'],
 'failed':         ['ba','alertC',     ''],
 'stuck':          ['ba','alertC',     ''],
 'idle':           ['wa','alertT',     'Nothing heard from it lately'],
 /* ── account / licence ── */
 'active':         ['ok','checkCircle',''],
 'inactive':       ['mu','dot',        'Switched off deliberately'],
 'suspended':      ['ba','lock',       'Stopped by the vendor'],
 'expired':        ['ba','alertC',     'Past its date'],
 'revoked':        ['ba','alertC',     'Withdrawn by the vendor'],
 'deactivated':    ['mu','cloudOff',   'Released by the customer'],
 'trial':          ['in','history',    ''],
 'over limit':     ['wa','alertT',     'Using more than the plan allows'],
 /* ── plain answers, which are not statuses ── */
 'yes':            ['ok','check',      ''],
 'no':             ['mu','x',          'Simply not the case — not a fault'],
 'on':             ['ok','check',      ''],
 'off':            ['mu','dot',        'Switched off — not a fault'],
 'none':           ['mu','dot',        ''],
 'fine':           ['ok','checkCircle',''],
 'pass':           ['ok','checkCircle',''],
 'healthy':        ['ok','checkCircle','']

   own precise wording instead of overloading a shared one — nothing here
   overrides the dictionary, it simply is not in it. */
const STATUSEXEMPT=/^(over|at the limit|not in your plan|your plan|ask about it|scheduled|superseded|live|testing)/i;

function normaliseStatus(root){
 (root||document).querySelectorAll('.pill').forEach(p=>{
  if(p.dataset.sd) return;
  const raw=p.textContent.trim();
  if(!raw||raw==='—') return;
  const key=raw.toLowerCase().replace(/\s+/g,' ').replace(/[.!]$/,'');
  const d=STATUSDICT[key];
  if(!d){ p.dataset.sd='skip'; return; }
  if(STATUSEXEMPT.test(raw)){ p.dataset.sd='exempt'; return; }
  p.dataset.sd='1';
  ['ok','wa','ba','in','mu'].forEach(c=>p.classList.remove(c));

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   P0 · FORENSIC AUDIT — two fixes, both flexbox minimum-size faults
   ═══════════════════════════════════════════════════════════════════════ */

/* P0-1 — 390px horizontal overflow (82 of 123 screens)
   The topbar's context cluster and its children default to min-width:auto, so
   they refuse to shrink below their content width. .usr was pushed past the
   viewport — up to 52px — and body{overflow:hidden} CLIPPED it rather than
   scrolling, putting the sign-out control out of reach. Letting the subtree
   reach its true minimum makes it reflow. Verified: 0 overflowing screens at
   390/768/820/1024/1366/1600 in both languages, and desktop and tablet chrome
   keep the exact widths they have today (the cluster only compresses below
   820px, where the company chip is already hidden). */
.ctx *:not(.kbtn){min-width:0}
/* .kbtn is exempt: it carries a deliberate min-width ladder (210 → 150 → 0 at
   1520/1400/820) and already reaches 0 before the viewport gets tight, so the
   blanket rule was only clobbering its desktop rung. */

/* P0-2 — modal footer unreachable at 390px
   Below 820px the modal becomes full-screen and .mb{max-height:none} removes
   the bound that normally keeps the body scrollable. The body then grew to its
   content height (~2,000px on a stacked form) and pushed Cancel / Save & new /
   Save 1,168px below the bottom of the screen — no form could be submitted on
   a phone. Making the dialog a proper flex column restores the intent: header
   and footer fixed, body takes the remaining height and scrolls. */
@media (max-width:820px){
  /* the dialog already goes full-screen at this breakpoint, but the overlay
     kept its 40px desktop padding, so a 100vh dialog sat 43px past the bottom */
  #ov{padding:0}
  .mod{display:flex;flex-direction:column;height:100%;max-height:100%}
  .mh,.mf{flex:0 0 auto}
  .mb{flex:1 1 auto;min-height:0;overflow-y:auto}
