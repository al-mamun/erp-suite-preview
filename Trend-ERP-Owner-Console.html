<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend — Owner Console</title>
<style>
/* ============================================================= TOKENS */
:root{
  --brand-navy:#12204F; --brand-navy-2:#0A4067; --brand-teal:#0B4B71; --brand-teal-2:#12788E;
  --brand-green:#358A2C; --brand-green-2:#8DC637; --wordmark:#11395D;
  --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#F0F2F5; --surface-3:#E9ECF1;
  --border:#E2E5EA; --border-strong:#CDD3DC;
  --text:#12204F; --text-2:#3B4658; --muted:#5A6472; --faint:#8A93A2;
  --primary:#12204F; --primary-ink:#FFFFFF; --accent:#12788E;
  --success:#2E7D32; --success-bg:#E6F4E7; --warning:#B26A00; --warning-bg:#FBEFD9;
  --danger:#C0392B; --danger-bg:#FBE7E4; --info:#12788E; --info-bg:#E2F0F3;
  --ring:rgba(18,120,142,.35);
  --r-sm:6px; --r:10px; --r-lg:14px; --pill:999px;
  --sh-1:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --sh-2:0 8px 28px rgba(16,24,40,.14);
  --nav-w:248px; --nav-w-collapsed:64px; --top-h:56px;
  --fs:14px; --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-ar:"Segoe UI","Tahoma",system-ui,sans-serif;
  --dur:.18s;
}
:root[data-theme="dark"]{
  --bg:#0E1117; --surface:#161B22; --surface-2:#1C222B; --surface-3:#232B36;
  --border:#2A313C; --border-strong:#3A4350;
  --text:#E6EAF0; --text-2:#C3CBD6; --muted:#9AA4B2; --faint:#6C7686;
  --primary:#3A63B8; --primary-ink:#FFFFFF; --accent:#3FA3B8; --wordmark:#CFE0F5;
  --success:#4CAF50; --success-bg:#12301A; --warning:#E0A030; --warning-bg:#33280F;
  --danger:#E15B4C; --danger-bg:#331915; --info:#3FA3B8; --info-bg:#0F2A31;
  --ring:rgba(63,163,184,.4);
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 10px 34px rgba(0,0,0,.55);
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.5 var(--font);-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{font-family:var(--font-ar)}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--ring)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}

/* ============================================================= APP SHELL */
#app{display:grid;grid-template-columns:var(--nav-w) 1fr;grid-template-rows:var(--top-h) 1fr;
  grid-template-areas:"side top" "side main";height:100vh;transition:grid-template-columns var(--dur)}
#app.collapsed{grid-template-columns:var(--nav-w-collapsed) 1fr}
/* sidebar */
#side{grid-area:side;background:linear-gradient(180deg,var(--brand-navy),#0c1836);color:#dbe4f2;
  display:flex;flex-direction:column;overflow:hidden;border-inline-end:1px solid rgba(255,255,255,.06)}
:root[data-theme="dark"] #side{background:linear-gradient(180deg,#101725,#0a0f18)}
.brand{display:flex;align-items:center;gap:10px;padding:0 14px;height:var(--top-h);flex:0 0 auto;
  border-bottom:1px solid rgba(255,255,255,.07)}
.brand .tlogo{flex:0 0 auto}
.brand .bt{display:flex;flex-direction:column;line-height:1.05;overflow:hidden;white-space:nowrap}
.brand .bt b{font-size:15px;letter-spacing:.2px;color:#fff}
.brand .bt span{font-size:10.5px;color:var(--brand-green-2);letter-spacing:.5px;text-transform:uppercase}
#app.collapsed .brand .bt{display:none}
.navwrap{flex:1;overflow-y:auto;padding:8px 8px 20px}
.navwrap::-webkit-scrollbar{width:8px}.navwrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
.navgroup{margin-top:12px}
.navgroup>.gl{display:flex;align-items:center;width:100%;gap:6px;font-size:10px;text-transform:uppercase;
  letter-spacing:.9px;color:#7e8db0;padding:7px 10px 5px;white-space:nowrap;background:transparent;border:0;cursor:pointer}
.navgroup>.gl:hover{color:#c9d6ef}
.gl .glc{width:12px;height:12px;margin-inline-start:auto;opacity:.55;transition:transform .18s;stroke-width:2.4}
.navgroup.col .gl .glc{transform:rotate(-90deg)}
html[dir="rtl"] .navgroup.col .gl .glc{transform:rotate(90deg)}
.navitems{overflow:hidden}
#app:not(.collapsed) .navgroup.col .navitems{display:none}
#app.collapsed .navgroup>.gl{opacity:0;height:6px;padding:0;pointer-events:none}
.navitem{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:#c3cfe6;
  white-space:nowrap;position:relative;transition:background var(--dur),color var(--dur);font-size:13.5px}
.navitem svg{flex:0 0 18px;width:18px;height:18px;stroke-width:1.9}
.navitem .lbl{overflow:hidden;text-overflow:ellipsis}
.navitem:hover{background:rgba(255,255,255,.07);color:#fff}
.navitem.active{background:rgba(255,255,255,.13);color:#fff}
.navitem.active::before{content:"";position:absolute;inset-inline-start:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--brand-green-2)}
.navitem .tag{margin-inline-start:auto;font-size:9px;padding:1px 6px;border-radius:var(--pill);background:rgba(255,255,255,.14);color:#dfe8f6}
#app.collapsed .navitem .lbl,#app.collapsed .navitem .tag{display:none}
#app.collapsed .navitem{justify-content:center;padding:9px 0}
/* topbar */
#top{grid-area:top;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 14px;z-index:20}
.icbtn{width:34px;height:34px;display:inline-grid;place-items:center;border:1px solid transparent;border-radius:8px;
  background:transparent;color:var(--muted);position:relative}
.icbtn:hover{background:var(--surface-2);color:var(--text)}
.icbtn svg{width:18px;height:18px;stroke-width:1.9}
.ctxpick{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);min-width:0}
.ctxpick:hover{background:var(--surface-2)}
.ctxpick .co{display:flex;flex-direction:column;line-height:1.15;min-width:0;text-align:start}
.ctxpick .co b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxpick .co small{font-size:10.5px;color:var(--muted)}
.searchbtn{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;height:34px;padding:0 12px;
  border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--muted);font-size:13px}
.searchbtn:hover{border-color:var(--border-strong)}
.searchbtn .kbd{margin-inline-start:auto;font-size:10.5px;border:1px solid var(--border);border-radius:5px;
  padding:1px 6px;background:var(--surface);color:var(--faint)}
.spacer{flex:1}
.dot{position:absolute;top:6px;inset-inline-end:6px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--brand-teal-2),var(--brand-navy));
  color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
/* main */
#main{grid-area:main;overflow-y:auto;position:relative}
.page{padding:20px 24px 60px;max-width:1400px;margin:0 auto;animation:fade var(--dur) ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.crumbs{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-bottom:6px;flex-wrap:wrap}
.crumbs svg{width:13px;height:13px;opacity:.6}
.phead{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.phead h1{margin:0;font-size:22px;letter-spacing:-.3px}
.phead p{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.phead .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ============================================================= PRIMITIVES */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;
  transition:background var(--dur),border-color var(--dur),transform var(--dur)}
.btn:hover{background:var(--surface-2)}.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px;stroke-width:2}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:var(--border)}.btn.danger:hover{background:var(--danger-bg)}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:var(--pill);
  background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);white-space:nowrap}
.badge .bd{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.success{color:var(--success);background:var(--success-bg);border-color:transparent}
.badge.warning{color:var(--warning);background:var(--warning-bg);border-color:transparent}
.badge.danger{color:var(--danger);background:var(--danger-bg);border-color:transparent}
.badge.info{color:var(--info);background:var(--info-bg);border-color:transparent}
.badge.ni{color:var(--faint);background:transparent;border:1px dashed var(--border-strong);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--border);
  border-radius:var(--pill);background:var(--surface);font-size:12px;color:var(--text-2)}
.chip.on{background:var(--info-bg);border-color:transparent;color:var(--info)}
.chip svg{width:15px;height:15px;flex:0 0 15px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-1)}
.card .ch{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card .ch h3{margin:0;font-size:14px}.card .ch .sub{font-size:12px;color:var(--muted)}
.card .cb{padding:16px}
.grid{display:grid;gap:14px}
.banner{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border-radius:var(--r);font-size:12.5px;margin-bottom:16px}
.banner svg{width:17px;height:17px;flex:0 0 17px;margin-top:1px}
.banner.warn{background:var(--warning-bg);color:var(--warning)}
.banner.block{background:var(--danger-bg);color:var(--danger)}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner b{font-weight:700}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh-1)}
.kpi .kl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .kl svg{width:15px;height:15px}
.kpi .kv{font-size:25px;font-weight:650;letter-spacing:-.5px;margin-top:6px}
.kpi .kd{font-size:11.5px;margin-top:3px;display:flex;align-items:center;gap:5px;color:var(--muted)}
.kpi .kd.up{color:var(--success)}.kpi .kd.down{color:var(--danger)}
.kpi .kv.na{color:var(--faint);font-weight:500;font-size:20px}

/* TABLE */
.tbar{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tinput{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--border);
  border-radius:8px;background:var(--surface-2);min-width:180px}
.tinput svg{width:15px;height:15px;color:var(--muted)}
.tinput input{border:0;background:transparent;outline:0;color:var(--text);width:100%;font:inherit;font-size:13px}
.selbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--info-bg);color:var(--info);
  font-size:12.5px;border-bottom:1px solid var(--border)}
.tscroll{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th,.dt td{padding:9px 14px;text-align:start;white-space:nowrap;border-bottom:1px solid var(--border)}
.dt th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.4px;z-index:1;user-select:none}
.dt th.sortable{cursor:pointer}.dt th.sortable:hover{color:var(--text)}
.dt th .sar{opacity:.4;margin-inline-start:4px}.dt th.asc .sar,.dt th.desc .sar{opacity:1;color:var(--accent)}
.dt tbody tr{transition:background var(--dur)}
.dt tbody tr:hover{background:var(--surface-2)}
.dt tbody tr.sel{background:var(--info-bg)}
.dt td.num{text-align:end;font-variant-numeric:tabular-nums}
.dt td.rowact{text-align:end}
.chkbx{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.rowbtn{opacity:0;width:28px;height:28px;border-radius:6px;display:inline-grid;place-items:center;border:1px solid transparent}
tr:hover .rowbtn{opacity:1}.rowbtn:hover{background:var(--surface-3)}
.tfoot{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.pager{margin-inline-start:auto;display:flex;align-items:center;gap:4px}
.pgn{min-width:30px;height:30px;padding:0 7px;border:1px solid var(--border);border-radius:7px;background:var(--surface);font-size:12.5px}
.pgn:hover{background:var(--surface-2)}.pgn.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.pgn:disabled{opacity:.4}
/* states */
.state{padding:46px 20px;text-align:center;color:var(--muted)}
.state svg{width:38px;height:38px;opacity:.5;margin-bottom:10px}
.state h4{margin:0 0 4px;color:var(--text);font-size:15px}
.state p{margin:0 0 14px;font-size:13px}
.skel{height:13px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));
  background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}

/* FORM */
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:2px}
.field>label{font-size:12px;font-weight:600;color:var(--text-2)}
.field>label .req{color:var(--danger)}
.inp,.sel,textarea.inp{height:36px;padding:0 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);
  color:var(--text);font:inherit;font-size:13px;outline:0;transition:border-color var(--dur),box-shadow var(--dur);width:100%}
textarea.inp{height:auto;padding:9px 11px;resize:vertical;min-height:64px}
.inp:focus,.sel:focus,textarea.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.field.err .inp,.field.err .sel{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-bg)}
.field .msg{font-size:11.5px;color:var(--danger);display:none}
.field.err .msg{display:block}
.field .hint{font-size:11px;color:var(--faint)}
.switch{position:relative;width:38px;height:22px;border-radius:var(--pill);background:var(--border-strong);transition:background var(--dur);flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:inset-inline-start var(--dur)}
.switch.on{background:var(--accent)}.switch.on::after{inset-inline-start:18px}
html[dir="rtl"] .switch.on::after{inset-inline-start:2px;inset-inline-end:18px}

/* DRAWER + DIALOG + PALETTE */
.scrim{position:fixed;inset:0;background:rgba(10,16,32,.44);backdrop-filter:blur(1px);z-index:60;opacity:0;transition:opacity var(--dur)}
.scrim.show{opacity:1}
.drawer{position:fixed;top:0;inset-inline-end:0;height:100vh;width:min(560px,94vw);background:var(--surface);z-index:61;
  box-shadow:var(--sh-2);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
html[dir="rtl"] .drawer{inset-inline-end:0;transform:translateX(-100%)}
.drawer.show{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border)}
.drawer .dh h3{margin:0;font-size:16px}.drawer .db{padding:18px;overflow-y:auto;flex:1}
.drawer .df{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end}
.dialog{position:fixed;z-index:62;top:50%;left:50%;transform:translate(-50%,-48%);width:min(440px,94vw);
  background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:22px;opacity:0;transition:opacity var(--dur),transform var(--dur)}
.dialog.show{opacity:1;transform:translate(-50%,-50%)}
.dialog h3{margin:0 0 7px;font-size:17px}.dialog p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.dialog .da{display:flex;gap:9px;justify-content:flex-end}
.palette{position:fixed;z-index:62;top:76px;left:50%;transform:translateX(-50%) scale(.98);width:min(600px,94vw);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden;opacity:0;transition:opacity var(--dur),transform var(--dur)}
.palette.show{opacity:1;transform:translateX(-50%) scale(1)}
.palette .pin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.palette .pin svg{width:18px;height:18px;color:var(--muted)}
.palette .pin input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:var(--text)}
.plist{max-height:52vh;overflow-y:auto;padding:6px}
.pitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;font-size:13.5px}
.pitem .pg{margin-inline-start:auto;font-size:11px;color:var(--faint)}
.pitem svg{width:16px;height:16px;color:var(--muted)}
.pitem.cur,.pitem:hover{background:var(--surface-2)}
.pitem.cur{outline:1px solid var(--border-strong)}
/* menu (user / notif) */
.menu{position:fixed;z-index:62;min-width:220px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:var(--sh-2);padding:6px;font-size:13px;opacity:0;transform:translateY(-4px);transition:opacity var(--dur),transform var(--dur)}
.menu.show{opacity:1;transform:none}
.menu .mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px}
.menu .mi:hover{background:var(--surface-2)}.menu .mi svg{width:16px;height:16px;color:var(--muted)}
.menu .sep{height:1px;background:var(--border);margin:5px 2px}
.menu .mt{padding:8px 10px 4px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
.notif{display:flex;gap:10px;padding:9px 10px;border-radius:8px}
.notif:hover{background:var(--surface-2)}
.notif .ni{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 30px}
.notif small{color:var(--muted);font-size:11.5px}
/* toasts */
#toasts{position:fixed;z-index:70;bottom:18px;inset-inline-end:18px;display:flex;flex-direction:column;gap:9px}
.toast{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-inline-start:3px solid var(--accent);
  border-radius:10px;box-shadow:var(--sh-2);padding:11px 14px;font-size:13px;min-width:250px;max-width:360px;
  transform:translateX(120%);transition:transform .24s ease}
html[dir="rtl"] .toast{transform:translateX(-120%)}
.toast.show{transform:none}
.toast.success{border-inline-start-color:var(--success)}.toast.danger{border-inline-start-color:var(--danger)}
.toast svg{width:17px;height:17px;flex:0 0 17px}

/* charts */
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.bars .bar{flex:1;background:linear-gradient(180deg,var(--brand-teal-2),var(--brand-navy));border-radius:5px 5px 0 0;min-height:3px;
  position:relative;transition:filter var(--dur)}
.bars .bar:hover{filter:brightness(1.15)}
.bars .bar span{position:absolute;bottom:-19px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:26px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-inline-end:5px}
.donut{width:132px;height:132px;flex:0 0 132px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.act{display:flex;gap:11px;padding:9px 4px;border-bottom:1px solid var(--border);font-size:13px}
.act:last-child{border:0}
.act .ai{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 30px;background:var(--surface-2)}
.act .ai svg{width:15px;height:15px}
.act small{color:var(--muted);font-size:11.5px}
.act .at{margin-inline-start:auto;color:var(--faint);font-size:11.5px;white-space:nowrap}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.qab{display:flex;flex-direction:column;gap:7px;padding:14px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);align-items:flex-start;text-align:start}
.qab:hover{background:var(--surface-2);border-color:var(--border-strong)}
.qab .qi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--info-bg);color:var(--info)}
.qab .qi svg{width:18px;height:18px}
.qab b{font-size:13px}.qab small{font-size:11.5px;color:var(--muted)}
.detgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 22px}
.dl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.dv{font-size:14px;margin-top:2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:9px 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}.tab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.mobtoggle{display:none}
@media(max-width:900px){
  #app{grid-template-columns:0 1fr}
  #app.mob #side{position:fixed;width:var(--nav-w);z-index:80;height:100vh}
  #app.mob::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:79}
  .mobtoggle{display:inline-grid}
  .two{grid-template-columns:1fr}
  .searchbtn .kbd{display:none}
  #top{gap:6px;padding:0 8px}
  #collapseBtn{display:none}
  .ctxpick .co{display:none}
  .ctxpick{padding:5px 6px}
  .searchbtn{flex:0 0 auto;max-width:none;width:34px;padding:0;justify-content:center}
  .searchbtn>span{display:none}
  .step{min-width:120px}
}
/* ---- floorplan additions (Stage B) ---- */
/* object page */
.objhdr{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:2px;margin-bottom:2px}
.oh-main{display:flex;align-items:center;gap:14px;padding:8px 0 12px}
.oh-av{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;flex:0 0 52px;background:linear-gradient(135deg,var(--brand-teal-2),var(--brand-navy))}
.oh-av svg{width:24px;height:24px;stroke:#fff;fill:none}
.oh-main h1{margin:0;font-size:22px;letter-spacing:-.3px}
.oh-sub{color:var(--muted);font-size:13px;margin-top:2px}
.oh-status{margin-inline-start:6px}
.oh-actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.oh-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 20px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-1)}
.objtabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:16px 0 18px;overflow-x:auto}
.objtab{padding:10px 15px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;background:0;border-0;white-space:nowrap}
.objtab:hover{color:var(--text)}.objtab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.opanel{display:none;animation:fade var(--dur)}.opanel.on{display:block}
.rel{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:background var(--dur)}
.rel:hover{background:var(--surface-2)}
.rel .ri{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);flex:0 0 34px}
.rel .ri svg{width:16px;height:16px;color:var(--muted)}
.rel .rt{flex:1}.rel .rt b{font-size:13.5px}.rel .rt small{display:block;color:var(--muted);font-size:12px}
.rel .rm{font-weight:600;font-variant-numeric:tabular-nums}
.rel .rlink{color:var(--faint)}
/* workspace cues */
.cues{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.cue{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;cursor:pointer;text-align:start;transition:border-color var(--dur),transform var(--dur);box-shadow:var(--sh-1)}
.cue:hover{border-color:var(--accent);transform:translateY(-1px)}
.cue .cl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.cue .cl svg{width:15px;height:15px}
.cue .cv{font-size:26px;font-weight:650;letter-spacing:-.5px;margin-top:6px}
.cue.warn .cv{color:var(--warning)}.cue.danger .cv{color:var(--danger)}.cue.ok .cv{color:var(--success)}
.cue .cd{font-size:11.5px;color:var(--faint);margin-top:2px}
.wsgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media(max-width:900px){.wsgrid{grid-template-columns:1fr}.oh-actions{margin-inline-start:0;width:100%}}
/* filter bar + views + columns */
.fbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.views{display:flex;gap:5px;flex-wrap:wrap}
.view{height:28px;padding:0 11px;border:1px solid var(--border);border-radius:var(--pill);background:var(--surface);font-size:12px;color:var(--text-2)}
.view:hover{background:var(--surface-2)}
.view.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.view .vc{opacity:.7;margin-inline-start:4px}
.colmenu{position:fixed;z-index:62;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-2);padding:6px;min-width:190px}
.colmenu .cm{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;font-size:13px;cursor:pointer}
.colmenu .cm:hover{background:var(--surface-2)}
/* wizard */
.wizrail{display:flex;flex-direction:column;gap:4px}
.wizstep{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;font-size:13.5px;color:var(--muted)}
.wizstep .wc{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-3);flex:0 0 26px}
.wizstep.done .wc{background:var(--success);color:#fff}.wizstep.cur{background:var(--surface-2);color:var(--text)}.wizstep.cur .wc{background:var(--accent);color:#fff}
.wizgrid{display:grid;grid-template-columns:230px 1fr;gap:20px}
@media(max-width:800px){.wizgrid{grid-template-columns:1fr}}
/* ---- redesign additions ---- */
.demo{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:2px 8px;border-radius:var(--pill);background:var(--warning-bg);color:var(--warning);text-transform:uppercase}
.demo.blue{background:var(--info-bg);color:var(--info)}
.demo.grey{background:var(--surface-2);color:var(--muted)}
/* tree */
.tree{font-size:13px}
.tnode{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:default}
.tnode:hover{background:var(--surface-2)}
.tnode .tw{width:18px;height:18px;display:inline-grid;place-items:center;flex:0 0 18px;border-radius:5px;cursor:pointer;color:var(--muted)}
.tnode .tw:hover{background:var(--surface-3)}
.tnode .tw svg{width:13px;height:13px;transition:transform .15s}
.tnode.col .tw svg{transform:rotate(-90deg)}
html[dir="rtl"] .tnode.col .tw svg{transform:rotate(90deg)}
.tnode .tw.leaf{opacity:0;cursor:default}
.tnode .tcode{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--muted);font-size:12px;min-width:78px}
.tnode .tname{font-weight:500}
.tnode.hd .tname{font-weight:700}
.tnode .ttype{margin-inline-start:auto;font-size:11px;color:var(--faint)}
.tchild{margin-inline-start:20px;border-inline-start:1px solid var(--border);padding-inline-start:6px}
.tchild.hide{display:none}
/* in-drawer tabs */
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:-4px 0 16px}
.dtab{padding:9px 13px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;background:0;border-0}
.dtab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.dpanel{display:none}.dpanel.on{display:block}
.dhead{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.dhead .dav{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;background:linear-gradient(135deg,var(--brand-teal-2),var(--brand-navy))}
.dhead h4{margin:0;font-size:17px}.dhead .dsub{color:var(--muted);font-size:12.5px}
/* stepper */
.stepper{display:flex;flex-wrap:wrap;gap:0;margin:4px 0 6px}
.step{display:flex;align-items:center;gap:10px;flex:1;min-width:150px;position:relative;padding:4px 0}
.step .sc{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 28px;z-index:1}
.step.done .sc{background:var(--success);color:#fff}.step.cur .sc{background:var(--accent);color:#fff}
.step.todo .sc{background:var(--surface-3);color:var(--muted)}
.step .sl{font-size:12.5px}.step.todo .sl{color:var(--muted)}
.step .st{font-size:11px;color:var(--faint)}
.step::after{content:"";position:absolute;top:18px;inset-inline-start:28px;width:calc(100% - 28px);height:2px;background:var(--border)}
.step.done::after{background:var(--success)}
.step:last-child::after{display:none}
/* health tiles */
.health{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.htile{border:1px solid var(--border);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;gap:11px;align-items:center}
.htile .hi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:0 0 38px}
.htile .hi svg{width:19px;height:19px}
.htile b{font-size:14px}.htile small{display:block;color:var(--muted);font-size:12px}
.hup{background:var(--success-bg);color:var(--success)}.hwarn{background:var(--warning-bg);color:var(--warning)}.hdown{background:var(--danger-bg);color:var(--danger)}
/* auth gate */
.authgate{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#0c1836,#12204F 60%,#0B4B71);display:grid;place-items:center;padding:20px}
.authcard{width:min(400px,94vw);background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:30px 30px 26px}
.authcard .abrand{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.authcard .abrand b{font-size:18px;color:var(--text)}.authcard .abrand span{font-size:10px;letter-spacing:1.4px;color:var(--brand-green);text-transform:uppercase;display:block}
.authcard h2{margin:16px 0 3px;font-size:20px}.authcard .asub{color:var(--muted);font-size:13px;margin-bottom:18px}
.authcard .alink{color:var(--accent);font-size:12.5px;cursor:pointer;background:0;border:0;padding:0}
.authcard .arow{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.kpi .kd svg{width:14px;height:14px}
.searchbtn>svg{width:16px;height:16px;flex:0 0 16px}
.notif .ni svg{width:15px;height:15px}
.rowbtn svg{width:15px;height:15px}
.pgn svg{width:14px;height:14px}
.pgn[data-pg$=":prev"] svg{transform:rotate(180deg)}
html[dir="rtl"] .pgn svg{transform:rotate(180deg)}
html[dir="rtl"] .pgn[data-pg$=":prev"] svg{transform:none}
.hidden{display:none!important}

/* Reusable data table: sort/search/paginate/select/states + saved views + column control + object nav */
const COLREG={};
function table(cfg){
  const st=tstate(cfg.id);
  COLREG[cfg.id]=cfg.cols.map(c=>({key:c.key,label:c.label}));
  const cols=cfg.cols.filter(c=>!(st.hidden&&st.hidden.has(c.key)));
  let rows=cfg.rows.slice();
  if(cfg.state==='loading'){ return tableShell(cfg,'<tbody>'+gen(6,()=>'<tr>'+cols.map(()=>'<td><div class="skel" style="width:'+rnd(40,90)+'%"></div></td>').join('')+'</tr>').join('')+'</tbody>',true); }
  if(cfg.state==='error'){ return tableShell(cfg,'<tbody><tr><td colspan="'+(cols.length+2)+'"><div class="state">'+ic('alert')+'<h4>Could not load '+t(cfg.title)+'</h4><p>A network error occurred while fetching this data.</p><button class="btn" onclick="rerender()">Retry</button></div></td></tr></tbody>'); }
  if(cfg.views&&cfg.views[st.view]&&cfg.views[st.view].f){ rows=rows.filter(cfg.views[st.view].f); }
  if(st.q){ const q=st.q.toLowerCase(); rows=rows.filter(r=>cfg.cols.some(c=>String(typeof c.val==='function'?c.val(r):r[c.key]).toLowerCase().includes(q))); }
  if(st.sort){ const c=cfg.cols.find(x=>x.key===st.sort); if(c){ rows.sort((a,b)=>{let x=c.raw?c.raw(a):a[c.key],y=c.raw?c.raw(b):b[c.key]; if(typeof x==='number')return (x-y)*st.dir; return String(x).localeCompare(String(y))*st.dir;}); } }
  const total=rows.length;
  if(total===0){ return tableShell(cfg,'<tbody><tr><td colspan="'+(cols.length+2)+'"><div class="state">'+ic('inbox')+'<h4>'+(st.q?'No matches':'Nothing here yet')+'</h4><p>'+(st.q?'No '+t(cfg.title).toLowerCase()+' match “'+st.q+'”.':'When you add '+t(cfg.title).toLowerCase()+' they will appear here.')+'</p>'+(st.q||cfg.obj?'':'<button class="btn primary" data-new="'+cfg.id+'">'+ic('plus')+t('New')+'</button>')+'</div></td></tr></tbody>'); }
  const pages=Math.ceil(total/st.per); if(st.page>pages)st.page=pages; if(st.page<1)st.page=1;
  const slice=rows.slice((st.page-1)*st.per,st.page*st.per);
  const openRow=r=>cfg.obj?('data-obj="'+cfg.obj+':'+r.id+'"'):('data-row="'+cfg.id+':'+r.id+'"');
  const openBtn=r=>cfg.obj?('data-obj="'+cfg.obj+':'+r.id+'"'):('data-open="'+cfg.id+':'+r.id+'"');
  const head='<thead><tr><th style="width:34px"><input type="checkbox" class="chkbx" data-selall="'+cfg.id+'" aria-label="Select all" '+(slice.length&&slice.every(r=>st.sel.has(r.id))?'checked':'')+'></th>'+
    cols.map(c=>'<th class="'+(c.num?'num ':'')+'sortable '+(st.sort===c.key?(st.dir>0?'asc':'desc'):'')+'" data-sort="'+c.key+'" data-t="'+cfg.id+'">'+t(c.label)+'<span class="sar">'+(st.sort===c.key?(st.dir>0?'▲':'▼'):'↕')+'</span></th>').join('')+
    '<th style="width:44px"></th></tr></thead>';
  const body='<tbody>'+slice.map(r=>{
    return '<tr class="'+(st.sel.has(r.id)?'sel':'')+'" '+openRow(r)+'>'+
      '<td><input type="checkbox" class="chkbx" data-selrow="'+cfg.id+':'+r.id+'" aria-label="Select row" '+(st.sel.has(r.id)?'checked':'')+'></td>'+
      cols.map(c=>{const val=typeof c.val==='function'?c.val(r):r[c.key];return '<td class="'+(c.num?'num':'')+'">'+val+'</td>';}).join('')+
      '<td class="rowact"><button class="rowbtn" '+openBtn(r)+' title="Open" aria-label="Open">'+ic('eye')+'</button></td></tr>';
  }).join('')+'</tbody>';
  const foot='<div class="tfoot"><span>'+((st.page-1)*st.per+1)+'–'+Math.min(st.page*st.per,total)+' of '+total+'</span>'+
    '<div class="pager"><button class="pgn" data-pg="'+cfg.id+':prev" '+(st.page===1?'disabled':'')+' aria-label="Previous page">'+ic('chevr','')+'</button>'+
    gen(pages,p=>'<button class="pgn '+(p+1===st.page?'on':'')+'" data-pg="'+cfg.id+':'+(p+1)+'">'+(p+1)+'</button>').join('')+
    '<button class="pgn" data-pg="'+cfg.id+':next" '+(st.page===pages?'disabled':'')+' aria-label="Next page">'+ic('chevr')+'</button></div></div>';
  const selbar=st.sel.size?'<div class="selbar">'+ic('check')+'<b>'+st.sel.size+'</b> '+t('selected')+
    '<button class="btn sm" data-bulk="print:'+cfg.id+'">'+ic('print')+'Print</button>'+
    '<button class="btn sm" data-bulk="export:'+cfg.id+'">'+ic('paperclip')+'Export</button>'+
    '<button class="btn sm ghost" data-bulk="clear:'+cfg.id+'">Clear</button></div>':'';
  return tableShell(cfg,head+body,false,selbar,foot);
}
function tableShell(cfg,inner,loading,selbar,foot){
  const st=tstate(cfg.id);
  const viewsBar=cfg.views?'<div class="fbar"><div class="views" role="tablist">'+cfg.views.map((v,i)=>{const n=v.f?cfg.rows.filter(v.f).length:cfg.rows.length;return '<button class="view '+(i===st.view?'on':'')+'" data-view="'+cfg.id+':'+i+'">'+v.label+'<span class="vc">'+n+'</span></button>';}).join('')+'</div>'+
    '<div style="margin-inline-start:auto"><button class="chip" data-colmenu="'+cfg.id+'">'+ic('layers')+'Columns</button></div></div>':'';
  const bar='<div class="tbar"><div class="tinput">'+ic('search')+'<input placeholder="'+t('Search')+' '+t(cfg.title).toLowerCase()+'…" value="'+(st.q||'')+'" data-search="'+cfg.id+'" aria-label="Search '+t(cfg.title)+'"></div>'+
    '<button class="chip">'+ic('filter')+t('Filter')+'</button>'+
    '<div style="margin-inline-start:auto;display:flex;gap:8px">'+
    (cfg.canNew?'<button class="btn sm primary" data-new="'+cfg.id+'">'+ic('plus')+t('New')+'</button>':'')+
    '<button class="btn sm" data-bulk="export:'+cfg.id+'">'+ic('paperclip')+t('Export')+'</button></div></div>';
  return '<div class="card">'+viewsBar+bar+(selbar||'')+'<div class="tscroll"><table class="dt">'+inner+'</table></div>'+(foot||'')+'</div>';
}
function money2(n,neg){return '<span class="mono"'+(neg&&n<0?' style="color:var(--danger)"':'')+'>'+(n<0?'('+money(-n)+')':money(n))+'</span>';}
function bars(vals,labels){const mx=Math.max(...vals);return '<div class="bars">'+vals.map((v,i)=>'<div class="bar" style="height:'+Math.round(v/mx*100)+'%" title="'+labels[i]+': '+v+'"><span>'+labels[i]+'</span></div>').join('')+'</div>';}
function donut(segs){ // segs=[{v,color,label}]
  const tot=segs.reduce((a,s)=>a+s.v,0);let off=0;const r=52,c=2*Math.PI*r;
  const arcs=segs.map(s=>{const len=s.v/tot*c;const el='<circle r="'+r+'" cx="66" cy="66" fill="none" stroke="'+s.color+'" stroke-width="18" stroke-dasharray="'+len+' '+(c-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 66 66)"/>';off+=len;return el;}).join('');
  return '<svg class="donut" viewBox="0 0 132 132">'+arcs+'<text x="66" y="63" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text)">'+tot+'</text><text x="66" y="80" text-anchor="middle" font-size="10" fill="var(--muted)">total</text></svg>';
}

/* overlays */
function scrim(cb){let s=document.createElement('div');s.className='scrim';document.body.appendChild(s);requestAnimationFrame(()=>s.classList.add('show'));s.onclick=cb;return s;}
let curOverlay=null;
function closeOverlay(){ if(!curOverlay)return; const{el,sc}=curOverlay; el.classList.remove('show'); sc.classList.remove('show'); setTimeout(()=>{el.remove();sc.remove();},200); curOverlay=null; }
function showDrawer(title,body,footer){
  const sc=scrim(closeOverlay);
  const d=document.createElement('aside');d.className='drawer';
  d.innerHTML='<div class="dh"><h3>'+title+'</h3><button class="icbtn" data-close style="margin-inline-start:auto">'+ic('x')+'</button></div><div class="db">'+body+'</div><div class="df">'+footer+'</div>';
  document.body.appendChild(d);requestAnimationFrame(()=>d.classList.add('show'));
  curOverlay={el:d,sc:sc};
}
function showDialog(title,msg,onOk,danger){
  const sc=scrim(closeOverlay);
  const d=document.createElement('div');d.className='dialog';
  d.innerHTML='<h3>'+title+'</h3><p>'+msg+'</p><div class="da"><button class="btn" data-close>'+t('Cancel')+'</button><button class="btn '+(danger?'danger':'primary')+'" data-ok>'+(danger?'Delete':'Confirm')+'</button></div>';
  document.body.appendChild(d);requestAnimationFrame(()=>d.classList.add('show'));
  curOverlay={el:d,sc:sc};
  d.querySelector('[data-ok]').onclick=()=>{closeOverlay();onOk&&onOk();};
}
function toast(msg,kind){
  const el=document.createElement('div');el.className='toast '+(kind||'success');
  el.innerHTML=ic(kind==='danger'?'alert':'check')+'<span>'+msg+'</span>';
  $('#toasts').appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),260);},2600);
}
/* command palette */
function openPalette(){
  const sc=scrim(closeOverlay);
  const p=document.createElement('div');p.className='palette';
  const all=[];NAV.forEach(g=>g.items.forEach(it=>all.push({id:it.id,label:it.label,group:g.g,icon:it.icon,tag:it.tag})));
  p.innerHTML='<div class="pin">'+ic('search')+'<input placeholder="Search screens, actions…" id="palIn"><span class="kbd" style="font-size:10.5px;border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--faint)">esc</span></div><div class="plist" id="palList"></div>';
  document.body.appendChild(p);requestAnimationFrame(()=>p.classList.add('show'));
  curOverlay={el:p,sc:sc};
  const inp=p.querySelector('#palIn');const list=p.querySelector('#palList');let cur=0;
  function draw(){const q=inp.value.toLowerCase();const res=all.filter(a=>t(a.label).toLowerCase().includes(q)||a.group.toLowerCase().includes(q));
    if(cur>=res.length)cur=0;
    list.innerHTML=res.length?res.map((a,i)=>'<div class="pitem '+(i===cur?'cur':'')+'" data-pal="'+a.id+'">'+ic(a.icon)+'<span>'+t(a.label)+'</span>'+(a.tag?'<span class="badge ni" style="font-size:9px">'+(a.tag==='UI'?'UI-only':'Blocked')+'</span>':'')+'<span class="pg">'+t(a.group)+'</span></div>').join(''):'<div class="state" style="padding:26px"><p>No screens match.</p></div>';
    list._res=res;}
  draw();inp.focus();
  inp.oninput=draw;
  inp.onkeydown=e=>{const res=list._res||[];if(e.key==='ArrowDown'){cur=Math.min(cur+1,res.length-1);draw();e.preventDefault();}else if(e.key==='ArrowUp'){cur=Math.max(cur-1,0);draw();e.preventDefault();}else if(e.key==='Enter'){if(res[cur]){closeOverlay();go(res[cur].id);}}};
  list.onclick=e=>{const it=e.target.closest('[data-pal]');if(it){closeOverlay();go(it.getAttribute('data-pal'));}};
}
/* floating menus */
function openMenu(btn,html){
  closeMenu();
  const m=document.createElement('div');m.className='menu';m.id='floatMenu';m.innerHTML=html;
  document.body.appendChild(m);
  const r=btn.getBoundingClientRect();const w=240;
  m.style.top=(r.bottom+6)+'px';
  if(document.dir==='rtl'||document.documentElement.dir==='rtl'){m.style.left=r.left+'px';}
  else{m.style.left=Math.max(8,r.right-w)+'px';m.style.minWidth=w+'px';}
  requestAnimationFrame(()=>m.classList.add('show'));
}
function closeMenu(){const m=$('#floatMenu');if(m)m.remove();}

/* event delegation */
document.addEventListener('click',e=>{
  const T=e.target;
  const go_=T.closest('[data-go]'); if(go_){go(go_.getAttribute('data-go'));return;}
  const nw=T.closest('[data-new]'); if(nw){openDrawer(nw.getAttribute('data-new'));return;}
  const op=T.closest('[data-open]'); if(op){const[id,rid]=op.getAttribute('data-open').split(':');openDrawer(id,rid);return;}
  const row=T.closest('[data-row]'); if(row&&!T.closest('input,button')){const[id,rid]=row.getAttribute('data-row').split(':');openDrawer(id,rid);return;}
  if(T.closest('[data-close]')){closeOverlay();return;}
  const sv=T.closest('[data-save]'); if(sv){ // validate required
    const dr=T.closest('.drawer');let bad=false;
    if(dr)dr.querySelectorAll('.field').forEach(f=>{const inp=f.querySelector('.inp');if(f.querySelector('.req')&&inp&&!inp.value.trim()){f.classList.add('err');bad=true;}else f.classList.remove('err');});
    if(bad){toast('Please fill the required fields','danger');return;}
    closeOverlay();toast(sv.getAttribute('data-save')==='draft'?'Draft saved (prototype — nothing posted)':'Saved (prototype)');return;}
  const tg=T.closest('[data-toast]'); if(tg){toast(tg.getAttribute('data-toast'));return;}
  const sw=T.closest('.switch[data-toggle],.switch[data-perm]'); if(sw){sw.classList.toggle('on');return;}
  // sort
  const th=T.closest('th[data-sort]'); if(th){const id=th.getAttribute('data-t');const k=th.getAttribute('data-sort');const st=tstate(id);if(st.sort===k)st.dir*=-1;else{st.sort=k;st.dir=1;}rerender();return;}
  // pager
  const pg=T.closest('[data-pg]'); if(pg){const[id,v]=pg.getAttribute('data-pg').split(':');const st=tstate(id);const rows=(SCREENS[S.screen],0);const pages=Math.max(1,Math.ceil((filteredCount(id))/st.per));if(v==='prev')st.page=Math.max(1,st.page-1);else if(v==='next')st.page=Math.min(pages,st.page+1);else st.page=+v;rerender();return;}
  // select all / row
  const sa=T.closest('[data-selall]'); if(sa){const id=sa.getAttribute('data-selall');const st=tstate(id);const rows=visibleRows(id);if(rows.every(r=>st.sel.has(r.id)))rows.forEach(r=>st.sel.delete(r.id));else rows.forEach(r=>st.sel.add(r.id));rerender();return;}
  const sr=T.closest('[data-selrow]'); if(sr){const[id,rid]=sr.getAttribute('data-selrow').split(':');const st=tstate(id);if(st.sel.has(+rid))st.sel.delete(+rid);else st.sel.add(+rid);rerender();return;}
  const bk=T.closest('[data-bulk]'); if(bk){const[act,id]=bk.getAttribute('data-bulk').split(':');const st=tstate(id);if(act==='clear'){st.sel.clear();rerender();}else{toast(act.charAt(0).toUpperCase()+act.slice(1)+' '+(st.sel.size||'all')+' (prototype)');}return;}
  // topbar
  const ng=T.closest('[data-navgroup]'); if(ng){const g=ng.getAttribute('data-navgroup');if(S.navcol.has(g))S.navcol.delete(g);else S.navcol.add(g);renderNav();return;}
  if(T.closest('#collapseBtn')){document.getElementById('app').classList.toggle('collapsed');S.collapsed=!S.collapsed;return;}
  if(T.closest('#mobBtn')){document.getElementById('app').classList.toggle('mob');return;}
  if(T.closest('#searchBtn')){openPalette();return;}
  if(T.closest('#themeBtn')){toggleTheme();return;}
  if(T.closest('#langBtn')){toggleLang();return;}
  if(T.closest('#notifBtn')){openNotif(T.closest('#notifBtn'));return;}
  if(T.closest('#userBtn')){openUser(T.closest('#userBtn'));return;}
  if(T.closest('#ctxBtn')){toast('Company / branch switcher (prototype)');return;}
  const mi=T.closest('#floatMenu [data-mi]'); if(mi){const a=mi.getAttribute('data-mi');closeMenu();if(a==='theme')toggleTheme();else if(a==='lang')toggleLang();else if(SCREENS[a])go(a);else toast(mi.textContent.trim()+' (prototype)');return;}
  if(!T.closest('#floatMenu')&&!T.closest('#notifBtn')&&!T.closest('#userBtn'))closeMenu();
});

  const s=e.target.closest('[data-search]'); if(s){const id=s.getAttribute('data-search');const st=tstate(id);st.q=s.value;st.page=1;

/* ---- tree ---- */
function filterTree(nodes,q){var out=[];nodes.forEach(function(nd){var kids=nd.kids?filterTree(nd.kids,q):[];var self=(nd.c+' '+nd.n).toLowerCase().indexOf(q)>=0;if(self||kids.length){var cp=Object.assign({},nd);cp.kids=self?(nd.kids||[]):kids;out.push(cp);}});return out;}
function tree(nodes,forceOpen){
  function row(nd){var has=nd.kids&&nd.kids.length;var col=!forceOpen&&S.treecol.has(nd.c);
    var h='<div class="tnode '+((nd.t==='Header'||nd.t==='Class')?'hd ':'')+(col?'col':'')+'"><span class="tw '+(has?'':'leaf')+'"'+(has?' data-tw="'+nd.c+'"':'')+'>'+(has?ic('chevd'):'')+'</span>'+
      '<span class="tcode">'+nd.c+'</span><span class="tname">'+nd.n+'</span>'+(nd.note?' <span class="demo">VAT · rule pending D-11</span>':'')+'<span class="ttype">'+nd.t+'</span></div>';
    if(has)h+='<div class="tchild'+(col?' hide':'')+'">'+nd.kids.map(row).join('')+'</div>';
    return h;}
  return '<div class="tree">'+nodes.map(row).join('')+'</div>';
}

/* ---- Finance: Linked Accounts (accounting routing — CR-025/026, ADR-013/023) ---- */
SCREENS.linked=function(){
  var rows=[
    ["Sales revenue","70 · Sales of merchandise","Class 7 · per company"],
    ["AR control (receivable)","411 · Customers","Class 4 · per company · per payment term (ADR-023)"],
    ["VAT collected (payable)","4457 · Collected VAT","Class 4 · rule pending D-11"],
    ["AP control (payable)","401 · Suppliers","Class 4 · per company"],
    ["Inventory","31 · Merchandise","Class 3 · per company · per warehouse"],
    ["Cost of goods sold","60 · Purchases","Class 6 · per company"],
    ["Cash / settlement","53 · Cash box","Class 5 · per payment term (ADR-023)"],
    ["Opening equity","111 · Opening balance","Class 1 · per company (his link)"],
    ["Stock difference / adjustment","6037 · Stock difference","Class 6 · per company (his link)"],
    ["Early-settlement discount","—","Per payment term (ADR-023)"]
  ];
  return phead({crumbs:["Finance","Linked Accounts"],title:"Linked Accounts",tag:"BLK",desc:"Which account each automatic entry posts to — configured per company, never hard-coded (ADR-013)."})+
  '<div class="banner info">'+ic('info')+'<div><b>Demonstration mapping.</b> This is the accounting-routing table the client asked for (CR-025/026): every automatic entry resolves its account here, <b>per company</b> — the software never contains an account code (ADR-013). The <b>real account targets come from the client’s chart (D-03)</b>, the precedence when several rules match is <b>undecided (D-01)</b>, and nothing posts until the matrix is signed (D-00).</div></div>'+
  '<div class="card"><div class="tbar"><div class="tinput">'+ic('search')+'<input placeholder="Search posting purposes…"></div><button class="chip">'+ic('building')+'Company: Beirut Trading Co.</button><span class="demo" style="margin-inline-start:auto">Demo data</span></div>'+
  '<div class="tscroll"><table class="dt"><thead><tr><th>Posting purpose</th><th>Linked account</th><th>Scope</th><th style="width:44px"></th></tr></thead><tbody>'+
  rows.map(function(r){return '<tr><td>'+r[0]+'</td><td class="mono">'+r[1]+'</td><td>'+r[2]+(r[1]==='—'?' <span class="badge ni">unmapped</span>':'')+'</td><td class="rowact"><button class="rowbtn" data-toast="Edit mapping (prototype)" aria-label="Edit">'+ic('edit')+'</button></td></tr>';}).join('')+
  '</tbody></table></div></div>'+
  '<div class="banner warn" style="margin-top:14px">'+ic('info')+'<div><b>Dynamic linking &amp; currency.</b> A company can create its own payment term and link it to a chart account (ADR-023); whether accounts carry a USD/LBP currency suffix (e.g. <span class="mono">71100001002</span>) depends on decision <b>D-05</b> and changes the size of the chart.</div></div>';
};

/* ---- Stage B event listeners ---- */
document.addEventListener('click',function(e){
  var v=e.target.closest('[data-view]'); if(v){var p=v.getAttribute('data-view').split(':');var st=tstate(p[0]);st.view=+p[1];st.page=1;st.sel.clear();rerender();return;}
  var cm=e.target.closest('[data-colmenu]'); if(cm){var id=cm.getAttribute('data-colmenu');var st2=tstate(id);var cols=COLREG[id]||[];openMenu(cm,'<div class="mt">Columns</div>'+cols.map(function(c){return '<div class="cm" data-coltoggle="'+id+':'+c.key+'"><span class="chkbx" style="width:14px;height:14px;border:1.5px solid '+(!st2.hidden.has(c.key)?'var(--accent);background:var(--accent)':'var(--border-strong)')+';border-radius:3px;display:inline-grid;place-items:center;color:#fff">'+(!st2.hidden.has(c.key)?'✓':'')+'</span>'+t(c.label)+'</div>';}).join(''));return;}
  var ct=e.target.closest('[data-coltoggle]'); if(ct){var q=ct.getAttribute('data-coltoggle').split(':');var st3=tstate(q[0]);if(st3.hidden.has(q[1]))st3.hidden.delete(q[1]);else st3.hidden.add(q[1]);closeMenu();rerender();return;}
  var ob=e.target.closest('[data-obj]'); if(ob&&!e.target.closest('input')){var pp=ob.getAttribute('data-obj').split(':');openObject(pp[0],pp[1]);return;}
  var ot=e.target.closest('[data-otab]'); if(ot&&!ot.closest('.drawer')){var i=ot.getAttribute('data-otab');if(S.obj)S.obj.tab=+i;document.querySelectorAll('#page .objtab').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-otab')===i);});document.querySelectorAll('#page .opanel').forEach(function(pn){pn.classList.toggle('on',pn.getAttribute('data-op')===i);});return;}
  var cr=e.target.closest('[data-create]'); if(cr){openCreate(cr.getAttribute('data-create'));return;}
  var cs=e.target.closest('[data-createsave]'); if(cs){var ty=cs.getAttribute('data-createsave');toast('Draft saved (prototype — nothing posted)');go(ty);return;}
  var on=e.target.closest('[data-onbnav]'); if(on){S.onbStep=+on.getAttribute('data-onbnav');rerender();return;}
});
